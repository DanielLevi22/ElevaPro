# Supabase local development config
# Docs: https://supabase.com/docs/guides/cli/config
# Rodar: supabase start (precisa Docker)

# Portas na faixa 473xx, não nas default 543xx.
#
# No Windows a faixa efêmera do TCP é 49152-65535, e o WinNAT/Hyper-V reserva
# blocos dentro dela a cada boot. Qualquer porta acima de 49152 -- inclusive as
# default 54321/54322 -- é uma loteria: o container sobe "healthy", o Docker
# aceita o PortBindings e simplesmente não publica a porta no host. O sintoma
# não parece de rede: o app fica girando no botão de login e o log só diz
# `Failed to connect to /10.0.2.2:<porta>`.
#
# 473xx está abaixo de 49152, fora do alcance do WinNAT.

[api]
enabled = true
port = 47321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 47322
shadow_port = 47320
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 47323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 47324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# URL do app mobile (Expo dev server)
site_url = "exp://127.0.0.1:8081"
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3000",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = false
# Local: não exige confirmação de email
enable_confirmations = false

# Convite do especialista pro aluno (ADR-0035, issue #332). Em produção, o
# mesmo HTML precisa ser colado no painel do Supabase (Authentication → Email
# Templates → Invite user) — não existe hoje um jeito de sincronizar isso por
# código para projeto hospedado, só para o ambiente local via este arquivo.
[auth.email.template.invite]
subject = "Você foi convidado para o Eleva Pro"
content_path = "./supabase/templates/invite.html"

# O serviço de e-mail embutido do Supabase é para teste: poucos e-mails por
# hora, sem SMTP custom. Resend é o SMTP de produção (issue #332) — mesmo
# template acima, entrega de verdade. A chave nunca vai para este arquivo:
# `env()` lê do ambiente na hora que o CLI sobe, igual o padrão da ADR-0021.
# Local: `RESEND_API_KEY` em `supabase/.env` (gitignored). Produção: painel do
# Supabase → Authentication → SMTP Settings — não é variável da Vercel, porque
# quem envia o e-mail é a infraestrutura do Supabase, não o Next.js.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
# PREENCHER: precisa ser um endereço no domínio verificado no Resend — não
# necessariamente elevapro.app; ver a decisão pendente no wizard da issue #332.
admin_email = "env(RESEND_SENDER_EMAIL)"
sender_name = "Eleva Pro"

[auth.mfa]
max_enrolled_factors = 2

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true

[analytics]
enabled = false
