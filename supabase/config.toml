# Supabase local development config
# Docs: https://supabase.com/docs/guides/cli/config
# Rodar: supabase start (precisa Docker)

# Portas na faixa 473xx, não nas default 543xx.
#
# No Windows a faixa efêmera do TCP é 49152-65535, e o WinNAT/Hyper-V reserva
# blocos dentro dela a cada boot. Qualquer porta acima de 49152 -- inclusive as
# default 54321/54322 -- é uma loteria: o container sobe "healthy", o Docker
# aceita o PortBindings e simplesmente não publica a porta no host. O sintoma
# não parece de rede: o app fica girando no botão de login e o log só diz
# `Failed to connect to /10.0.2.2:<porta>`.
#
# 473xx está abaixo de 49152, fora do alcance do WinNAT.

[api]
enabled = true
port = 47321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 47322
shadow_port = 47320
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 47323
api_url = "http://127.0.0.1"

# Caixa de e-mail local (Mailpit): todo e-mail do Auth local para aqui, e
# nenhum sai da máquina (#355). Ler em http://127.0.0.1:47324. Era `[inbucket]`,
# que o CLI marcou como obsoleto.
[local_smtp]
enabled = true
port = 47324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# URL do app mobile (Expo dev server)
site_url = "exp://127.0.0.1:8081"
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/auth/reset-password",
  "http://localhost:3000",
  "http://localhost:3000/auth/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

# Sem SMTP próprio o GoTrue limita o envio a poucos e-mails por hora. No local
# tudo cai no Mailpit, e o limite só atrapalharia quem testa convites em série.
[auth.rate_limit]
email_sent = 100

[auth.email]
enable_signup = true
double_confirm_changes = false
# Local: não exige confirmação de email
enable_confirmations = false

# Convite do especialista pro aluno (ADR-0035, issue #332). Em produção, o
# mesmo HTML precisa ser colado no painel do Supabase (Authentication → Email
# Templates → Invite user) — não existe hoje um jeito de sincronizar isso por
# código para projeto hospedado, só para o ambiente local via este arquivo.
[auth.email.template.invite]
subject = "Você foi convidado para o Eleva Pro"
content_path = "./supabase/templates/invite.html"

# SMTP de entrega real, desligado no local (#355): o convite de teste ia para
# fora da máquina, e o remetente de teste do Resend só entrega na caixa da dona
# da conta. Preview e produção configuram o SMTP no painel do Supabase
# (Authentication → SMTP Settings); este arquivo não chega lá.
#
# Para testar entrega real no local, descomente o bloco e preencha
# `RESEND_API_KEY` e `RESEND_SENDER_EMAIL` em `supabase/.env` (gitignored).
# A chave nunca vai para este arquivo: `env()` lê do ambiente quando o CLI sobe
# (ADR-0021).
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_API_KEY)"
# admin_email = "env(RESEND_SENDER_EMAIL)"
# sender_name = "Eleva Pro"

[auth.mfa]
max_enrolled_factors = 2

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true

[analytics]
enabled = false
