name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Detecta quais partes do monorepo mudaram
# Jobs de app só rodam se app/** ou shared/** mudaram
# Jobs de web só rodam se web/** ou shared/** mudaram
# Só docs mudaram → nenhum job roda
#
# shared/ entra nos dois porque o código dele é compilado dentro de ambos.
# Antes o filtro apontava para packages/**, pasta que o ADR-002 planejou mas
# nunca foi criada — na prática mudanças em shared/ não disparavam CI nenhum.

jobs:
  # ─────────────────────────────────────────
  # DETECÇÃO DE MUDANÇAS
  # ─────────────────────────────────────────
  changes:
    name: 🔎 Detect Changes
    runs-on: ubuntu-latest
    # Em `pull_request`, o paths-filter lista os arquivos pela API do GitHub, e
    # sem esta permissão o GITHUB_TOKEN devolve "Resource not accessible by
    # integration". O job falhava, os outputs saíam vazios, todo job de app e
    # web era pulado — e o gate final continuava verde.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'shared/**'
            web:
              - 'web/**'
              - 'shared/**'

  # ─────────────────────────────────────────
  # MONOREPO — LINT DA RAIZ
  # ─────────────────────────────────────────
  # Os jobs abaixo lintam apenas o próprio diretório, então shared/ e scripts/
  # nunca eram verificados por ninguém. O biome.json da raiz cobre tudo.
  root-lint:
    name: 🔍 [Root] Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npm run lint

  # ─────────────────────────────────────────
  # SCHEMA — referências de tabela e RLS
  # ─────────────────────────────────────────
  # Roda sempre, sem filtro de path: uma tabela pode ser removida do schema
  # sem que nenhum arquivo de app/ ou web/ mude no mesmo commit.
  schema-refs:
    name: 🗃️ Schema, RLS & API Auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verificar referências de tabela
        run: npm run db:check-refs

      # Tabela sem RLS não quebra nada: a aplicação segue funcionando e o dado
      # fica legível por qualquer conta autenticada. Sintoma zero até vazar —
      # foi assim que 18 das 27 tabelas ficaram abertas até 2026-08-11.
      - name: Verificar RLS nas tabelas
        run: npm run db:check-rls

      # A RLS não alcança rota que usa service_role: lá a única barreira é o
      # código. Em 2026-08-11 duas rotas de IA entregavam a anamnese de
      # qualquer aluno a qualquer conta autenticada, e o check de RLS passava.
      - name: Verificar autorização das rotas
        run: npm run api:check-auth

  # ─────────────────────────────────────────
  # APP — 1. LINT
  # ─────────────────────────────────────────
  lint:
    name: 🔍 [App] Lint & Format
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npm run lint

  # ─────────────────────────────────────────
  # APP — 2. TYPE CHECK
  # ─────────────────────────────────────────
  typecheck:
    name: 🔎 [App] TypeScript Check
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────
  # APP — 3. UNIT TESTS
  # ─────────────────────────────────────────
  test:
    name: 🧪 [App] Unit Tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL_DEV }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY_DEV }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage -- --ci
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-coverage-report
          path: app/coverage/
          retention-days: 7

  # ─────────────────────────────────────────
  # WEB — 4. LINT
  # ─────────────────────────────────────────
  web-lint:
    name: 🔍 [Web] Lint & Format
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npm run lint

  # ─────────────────────────────────────────
  # WEB — 5. TYPE CHECK
  # ─────────────────────────────────────────
  web-typecheck:
    name: 🔎 [Web] TypeScript Check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

  # ─────────────────────────────────────────
  # WEB — 6. UNIT TESTS
  # ─────────────────────────────────────────
  web-test:
    name: 🧪 [Web] Unit Tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage -- --passWithNoTests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_DEV }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_DEV }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-coverage-report
          path: web/coverage/
          retention-days: 7

  # ─────────────────────────────────────────
  # CI GATE — job final que agrupa tudo
  # Usado pelo Branch Protection como único
  # required status check obrigatório
  # ─────────────────────────────────────────
  ci-success:
    name: ✅ CI Passed
    runs-on: ubuntu-latest
    needs:
      [changes, root-lint, schema-refs, lint, typecheck, test, web-lint, web-typecheck, web-test]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          app_changed="${{ needs.changes.outputs.app }}"
          web_changed="${{ needs.changes.outputs.web }}"

          # A detecção de mudanças precisa ter passado. Se ela falha, os outputs
          # saem vazios, todo job filtrado é pulado e o resto deste script leria
          # "nada mudou" — o gate ficava verde com a suíte inteira sem rodar.
          # Aconteceu no PR #99: um PR de segurança passou com zero testes.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "❌ Detecção de mudanças falhou — nenhum job filtrado rodou"
            exit 1
          fi

          # Ambos rodam sempre — não dependem de filtro de path
          if [ "${{ needs.root-lint.result }}" != "success" ]; then
            echo "❌ Lint da raiz falhou"
            exit 1
          fi

          if [ "${{ needs.schema-refs.result }}" != "success" ]; then
            echo "❌ Tabela inexistente, tabela sem RLS, ou rota sem autorização"
            exit 1
          fi

          # Se app mudou, todos os jobs de app devem ter passado
          if [ "$app_changed" = "true" ]; then
            if [ "${{ needs.lint.result }}" != "success" ] || \
               [ "${{ needs.typecheck.result }}" != "success" ] || \
               [ "${{ needs.test.result }}" != "success" ]; then
              echo "❌ App CI failed"
              exit 1
            fi
          fi

          # Se web mudou, todos os jobs de web devem ter passado
          if [ "$web_changed" = "true" ]; then
            if [ "${{ needs.web-lint.result }}" != "success" ] || \
               [ "${{ needs.web-typecheck.result }}" != "success" ] || \
               [ "${{ needs.web-test.result }}" != "success" ]; then
              echo "❌ Web CI failed"
              exit 1
            fi
          fi

          echo "✅ All relevant CI checks passed"
