name: Release Web

# ──────────────────────────────────────────────────────
# Triggers:
#   development (web/** changes) → Deploy Preview
#   main        (web/** changes) → Deploy Production
#   web/vX.Y.Z                  → Production + GitHub Release
# ──────────────────────────────────────────────────────
on:
  push:
    branches:
      - development
      - main
    paths:
      - "web/**"
      - "shared/**"
      - "supabase/**"
    tags:
      - "web/v*.*.*"
  # Deploy sob demanda. Mudança só no workflow ou em docs não bate nos filtros de
  # path acima, então alterações no próprio pipeline — como o alias de preview —
  # não se aplicavam até alguém tocar em web/, shared/ ou supabase/.
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # 1. VALIDATE
  # ─────────────────────────────────────────
  validate:
    name: ✅ Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

  # ─────────────────────────────────────────
  # 2. MIGRATIONS — antes de qualquer deploy
  # ─────────────────────────────────────────
  # Schema sempre migra antes do código subir. Se falhar, nenhum deploy roda.
  migrate:
    name: 🗄️ Migrations
    needs: validate
    uses: ./.github/workflows/supabase-migrations.yml
    secrets: inherit

  # ─────────────────────────────────────────
  # 3. DEPLOY PREVIEW (push em development)
  # ─────────────────────────────────────────
  deploy-preview:
    name: 🌐 Deploy Preview
    runs-on: ubuntu-latest
    environment: preview
    needs: [validate, migrate]
    if: github.ref == 'refs/heads/development'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Pull Vercel project config
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Sem `env:`. O `vercel pull` acima já baixou as Environment Variables do
      # projeto para este ambiente, e o `vercel build` as lê de lá — inclusive
      # as `NEXT_PUBLIC_*`, que ele inlina no bundle.
      #
      # Uma fonte só, e é a Vercel. Cópia no GitHub Secrets significaria dois
      # valores para a mesma variável, livres para divergir sem aviso — e cada
      # ambiente fala com um Supabase diferente, então divergir aqui é apontar
      # o preview para o banco errado.
      #
      # Segredo de servidor (`ANTHROPIC_API_KEY`, `SUPABASE_SERVICE_ROLE_KEY`)
      # nunca entra num passo de build: o `deploy --prebuilt` sobe o output já
      # compilado e a função lê `process.env` do ambiente da Vercel. Passá-lo
      # aqui é no-op que PARECE resolver, e foi assim que a IA do preview ficou
      # fora do ar sem ninguém notar (ADR-0021).
      - name: Build (Preview)
        run: |
          set -euo pipefail

          # O `vercel pull` acima baixa as Environment Variables do projeto para
          # `.vercel/.env.preview.local`. Carregá-las aqui é o que faz o
          # `vercel build` enxergá-las: rodando FORA da Vercel ele não recebe o
          # ambiente do projeto sozinho — "Build not running on Vercel. System
          # environment variables will not be available." é o aviso dele mesmo.
          arquivo=$(ls .vercel/.env.*.local 2>/dev/null | head -1 || true)
          if [ -n "$arquivo" ]; then
            echo "carregando $arquivo"
            set -a; . "$arquivo"; set +a
          fi

          # `NEXT_PUBLIC_*` é inlinada no bundle: valor errado aqui vira um site
          # publicado apontando para o lugar errado, e nenhuma variável de
          # runtime conserta isso depois. Por isso a checagem é de FORMA, não só
          # de presença — foi um valor não-vazio e inválido que derrubou este
          # build, não a ausência (ADR-0021).
          case "${NEXT_PUBLIC_SUPABASE_URL:-}" in
            https://*.supabase.co|https://*.supabase.in) : ;;
            *)
              echo "::error::NEXT_PUBLIC_SUPABASE_URL inválida ou ausente no build: '${NEXT_PUBLIC_SUPABASE_URL:-<vazia>}'"
              echo "::error::Ela precisa existir no ambiente preview da Vercel e ser uma URL https de projeto Supabase."
              echo "::error::Sem ela o bundle sai apontando para um placeholder e o site publicado não fala com o banco."
              exit 1
              ;;
          esac

          npx vercel build --token=${{ secrets.VERCEL_TOKEN }}

      # `vercel deploy` pelo CLI gera um domínio novo com hash a cada execução —
      # a integração Git do Vercel é quem cria o alias de branch, e ela não está
      # no caminho aqui. Sem alias fixo, nada externo consegue apontar para o
      # preview: o build do mobile congelaria no deploy do dia.
      - name: Deploy to Vercel (Preview)
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"

      - name: Alias estável de preview
        run: |
          npx vercel alias set "${{ steps.deploy.outputs.url }}" "$PREVIEW_DOMAIN" \
            --token=${{ secrets.VERCEL_TOKEN }} --scope="$VERCEL_ORG_ID"
          echo "### 🌐 Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Estável: https://$PREVIEW_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          PREVIEW_DOMAIN: ${{ vars.VERCEL_PREVIEW_DOMAIN || 'elevapro-preview.vercel.app' }}

      # A guarda que faltava. Sete guardas de CÓDIGO existiam e nenhuma de
      # CONFIGURAÇÃO — e foi configuração que derrubou a IA por dias, com o
      # aluno vendo "indisponível" e ninguém sabendo por quê.
      #
      # A sonda não autentica de propósito: sem token, a rota responde
      # `401 {"error":"Token ausente."}` ANTES de tocar no modelo. Isso já prova
      # três coisas de uma vez — o deployment está no ar, o bypass da proteção
      # funciona, e o ambiente de servidor está completo, porque `rotaDeIA`
      # devolveria `503 server_misconfigured` antes do 401 se faltasse variável.
      # Autenticar exigiria um usuário de teste com dado de saúde real só para
      # medir configuração.
      - name: Smoke test do preview
        env:
          PREVIEW_DOMAIN: ${{ vars.VERCEL_PREVIEW_DOMAIN || 'elevapro-preview.vercel.app' }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${BYPASS:-}" ]; then
            echo "::error::Falta o secret VERCEL_AUTOMATION_BYPASS_SECRET. Sem ele a sonda não atravessa o Deployment Protection e não prova nada."
            echo "::error::Pegue em Vercel → projeto → Settings → Deployment Protection → Protection Bypass for Automation."
            exit 1
          fi

          url="https://$PREVIEW_DOMAIN/api/ai/student/nutribot"
          corpo=$(curl -sS -X POST "$url" \
            -H 'Content-Type: application/json' \
            ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} \
            -d '{"message":"smoke"}' --max-time 30 -w '\n%{http_code}')
          status=$(echo "$corpo" | tail -1)
          json=$(echo "$corpo" | sed '$d')
          echo "status=$status corpo=$json"

          if echo "$json" | grep -q 'server_misconfigured'; then
            echo "::error::A rota respondeu server_misconfigured: falta variável de servidor no ambiente de preview da Vercel."
            echo "::error::Confira com 'vercel env ls' e adicione com 'vercel env add <NOME> preview'. Depois redeploy."
            exit 1
          fi

          if [ "$status" -ge 500 ]; then
            echo "::error::A rota de IA respondeu $status. O deployment subiu mas o BFF quebra em execução."
            exit 1
          fi

          # A proteção da Vercel TAMBÉM responde 401. Sem distinguir, a sonda
          # passaria sem nunca ter falado com a aplicação — guarda que aprova
          # por engano é pior que guarda nenhuma, porque cria confiança falsa.
          # A assinatura da recusa dela é a chave `protection` no corpo.
          if echo "$json" | grep -q '"protection"'; then
            echo "::error::Quem respondeu foi o Deployment Protection da Vercel, não a aplicação."
            echo "::error::Confira o secret VERCEL_AUTOMATION_BYPASS_SECRET e o Protection Bypass for Automation do projeto."
            exit 1
          fi

          if [ "$status" != "401" ]; then
            echo "::error::Esperado 401 'Token ausente.' e veio $status."
            exit 1
          fi

          echo "✓ preview no ar, bypass funcionando e ambiente de servidor completo"

  # ─────────────────────────────────────────
  # 4. DEPLOY PRODUCTION (push em main ou tag)
  # ─────────────────────────────────────────
  deploy-production:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    environment: production
    needs: [validate, migrate]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/web/v')
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Pull Vercel project config
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Antes de construir, e não depois de publicar. Em preview o smoke test
      # pós-deploy basta: o pior caso é um preview quebrado. Em produção o pior
      # caso é o aluno, então a falha tem que acontecer enquanto ainda dá para
      # não publicar.
      #
      # A checagem é de PRESENÇA, não de validade — chave revogada passa por
      # aqui e só o smoke test alcança. Ver ADR-0021.
      - name: Conferir ambiente de produção na Vercel
        run: |
          set -euo pipefail
          lista=$(npx vercel env ls production --token=${{ secrets.VERCEL_TOKEN }})
          faltando=""
          for nome in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
                      ANTHROPIC_API_KEY SUPABASE_SERVICE_ROLE_KEY; do
            echo "$lista" | grep -q "$nome" || faltando="$faltando $nome"
          done

          if [ -n "$faltando" ]; then
            echo "::error::Ambiente Production da Vercel incompleto. Faltando:$faltando"
            echo "::error::Adicione com 'vercel env add <NOME> production'."
            echo "::error::A service role e as chaves do Supabase têm que ser as do projeto de PRODUÇÃO — reaproveitar as de preview é o que o ADR-0021 proíbe."
            exit 1
          fi
          echo "✓ ambiente Production completo"

      # Tudo vem do `vercel pull` acima. Ver ADR-0021.
      - name: Build (Production)
        run: |
          set -euo pipefail

          # O `vercel pull` acima baixa as Environment Variables do projeto para
          # `.vercel/.env.production.local`. Carregá-las aqui é o que faz o
          # `vercel build` enxergá-las: rodando FORA da Vercel ele não recebe o
          # ambiente do projeto sozinho — "Build not running on Vercel. System
          # environment variables will not be available." é o aviso dele mesmo.
          arquivo=$(ls .vercel/.env.*.local 2>/dev/null | head -1 || true)
          if [ -n "$arquivo" ]; then
            echo "carregando $arquivo"
            set -a; . "$arquivo"; set +a
          fi

          # `NEXT_PUBLIC_*` é inlinada no bundle: valor errado aqui vira um site
          # publicado apontando para o lugar errado, e nenhuma variável de
          # runtime conserta isso depois. Por isso a checagem é de FORMA, não só
          # de presença — foi um valor não-vazio e inválido que derrubou este
          # build, não a ausência (ADR-0021).
          case "${NEXT_PUBLIC_SUPABASE_URL:-}" in
            https://*.supabase.co|https://*.supabase.in) : ;;
            *)
              echo "::error::NEXT_PUBLIC_SUPABASE_URL inválida ou ausente no build: '${NEXT_PUBLIC_SUPABASE_URL:-<vazia>}'"
              echo "::error::Ela precisa existir no ambiente production da Vercel e ser uma URL https de projeto Supabase."
              echo "::error::Sem ela o bundle sai apontando para um placeholder e o site publicado não fala com o banco."
              exit 1
              ;;
          esac

          npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # O mesmo que o preview faz, sem bypass: produção não fica atrás do
      # Deployment Protection. Sem token a rota responde 401 'Token ausente.' —
      # e responderia 503 antes disso se faltasse variável de servidor.
      - name: Smoke test de produção
        env:
          PRODUCTION_DOMAIN: ${{ vars.VERCEL_PRODUCTION_DOMAIN }}
        run: |
          set -euo pipefail

          if [ -z "${PRODUCTION_DOMAIN:-}" ]; then
            echo "::error::Falta a variável de repositório VERCEL_PRODUCTION_DOMAIN."
            echo "::error::Defina em Settings → Secrets and variables → Actions → Variables com o domínio de produção."
            exit 1
          fi

          corpo=$(curl -sS -X POST "https://$PRODUCTION_DOMAIN/api/ai/student/nutribot" \
            -H 'Content-Type: application/json' \
            -d '{"message":"smoke"}' --max-time 30 -w '\n%{http_code}')
          status=$(echo "$corpo" | tail -1)
          json=$(echo "$corpo" | sed '$d')
          echo "status=$status corpo=$json"

          if echo "$json" | grep -q 'server_misconfigured'; then
            echo "::error::A rota respondeu server_misconfigured: falta variável de servidor no ambiente Production."
            exit 1
          fi

          if [ "$status" != "401" ]; then
            echo "::error::Esperado 401 'Token ausente.' e veio $status."
            exit 1
          fi

          echo "✓ produção no ar e com o ambiente de servidor completo"

  # ─────────────────────────────────────────
  # 4. GITHUB RELEASE (apenas tags)
  # ─────────────────────────────────────────
  github-release:
    name: 📝 GitHub Release
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/web/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --list 'web/v*' --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          NOTES=$(git log $RANGE --pretty=format:"- %s" --no-merges \
            | grep -E "^- (feat|fix|refactor|perf|docs|chore|test)(\(.+\))?:" \
            || echo "- Sem mudanças documentadas")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Eleva Pro Web ${{ github.ref_name }}"
          body: |
            ## ${{ github.ref_name }}

            ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
