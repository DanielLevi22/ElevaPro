name: Release Web

# ──────────────────────────────────────────────────────
# Triggers:
#   development (web/** changes) → Deploy Preview
#   main        (web/** changes) → Deploy Production
#   web/vX.Y.Z                  → Production + GitHub Release
# ──────────────────────────────────────────────────────
on:
  push:
    branches:
      - development
      - main
    paths:
      - "web/**"
      - "shared/**"
      - "supabase/**"
    tags:
      - "web/v*.*.*"
  # Deploy sob demanda. Mudança só no workflow ou em docs não bate nos filtros de
  # path acima, então alterações no próprio pipeline — como o alias de preview —
  # não se aplicavam até alguém tocar em web/, shared/ ou supabase/.
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # 1. VALIDATE
  # ─────────────────────────────────────────
  validate:
    name: ✅ Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

  # ─────────────────────────────────────────
  # 2. MIGRATIONS — antes de qualquer deploy
  # ─────────────────────────────────────────
  # Schema sempre migra antes do código subir. Se falhar, nenhum deploy roda.
  migrate:
    name: 🗄️ Migrations
    needs: validate
    uses: ./.github/workflows/supabase-migrations.yml
    secrets: inherit

  # ─────────────────────────────────────────
  # 3. DEPLOY PREVIEW (push em development)
  # ─────────────────────────────────────────
  deploy-preview:
    name: 🌐 Deploy Preview
    runs-on: ubuntu-latest
    environment: preview
    needs: [validate, migrate]
    if: github.ref == 'refs/heads/development'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Pull Vercel project config
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Só `NEXT_PUBLIC_*` entra aqui. Elas são inlinadas no bundle em tempo de
      # build, então precisam existir NESTE passo.
      #
      # Segredo de servidor NÃO vai aqui. O `vercel deploy --prebuilt` sobe o
      # output já compilado, e a função lê `process.env` das Environment
      # Variables do PROJETO na Vercel, escopadas por ambiente — o shell deste
      # runner não atravessa. Passar `ANTHROPIC_API_KEY` ou
      # `SUPABASE_SERVICE_ROLE_KEY` neste passo é no-op que PARECE resolver, e
      # foi assim que a IA do preview ficou fora do ar sem ninguém notar
      # (ADR-0021). Elas vivem em `vercel env`, e o smoke test abaixo falha o
      # deploy se faltarem.
      - name: Build (Preview)
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PREVIEW }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PREVIEW }}

      # `vercel deploy` pelo CLI gera um domínio novo com hash a cada execução —
      # a integração Git do Vercel é quem cria o alias de branch, e ela não está
      # no caminho aqui. Sem alias fixo, nada externo consegue apontar para o
      # preview: o build do mobile congelaria no deploy do dia.
      - name: Deploy to Vercel (Preview)
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"

      - name: Alias estável de preview
        run: |
          npx vercel alias set "${{ steps.deploy.outputs.url }}" "$PREVIEW_DOMAIN" \
            --token=${{ secrets.VERCEL_TOKEN }} --scope="$VERCEL_ORG_ID"
          echo "### 🌐 Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Estável: https://$PREVIEW_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          PREVIEW_DOMAIN: ${{ vars.VERCEL_PREVIEW_DOMAIN || 'elevapro-preview.vercel.app' }}

      # A guarda que faltava. Sete guardas de CÓDIGO existiam e nenhuma de
      # CONFIGURAÇÃO — e foi configuração que derrubou a IA por dias, com o
      # aluno vendo "indisponível" e ninguém sabendo por quê.
      #
      # A sonda não autentica de propósito: sem token, a rota responde
      # `401 {"error":"Token ausente."}` ANTES de tocar no modelo. Isso já prova
      # três coisas de uma vez — o deployment está no ar, o bypass da proteção
      # funciona, e o ambiente de servidor está completo, porque `rotaDeIA`
      # devolveria `503 server_misconfigured` antes do 401 se faltasse variável.
      # Autenticar exigiria um usuário de teste com dado de saúde real só para
      # medir configuração.
      - name: Smoke test do preview
        env:
          PREVIEW_DOMAIN: ${{ vars.VERCEL_PREVIEW_DOMAIN || 'elevapro-preview.vercel.app' }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          url="https://$PREVIEW_DOMAIN/api/ai/student/nutribot"
          corpo=$(curl -sS -X POST "$url" \
            -H 'Content-Type: application/json' \
            ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} \
            -d '{"message":"smoke"}' --max-time 30 -w '\n%{http_code}')
          status=$(echo "$corpo" | tail -1)
          json=$(echo "$corpo" | sed '$d')
          echo "status=$status corpo=$json"

          if echo "$json" | grep -q 'server_misconfigured'; then
            echo "::error::A rota respondeu server_misconfigured: falta variável de servidor no ambiente de preview da Vercel."
            echo "::error::Confira com 'vercel env ls' e adicione com 'vercel env add <NOME> preview'. Depois redeploy."
            exit 1
          fi

          if [ "$status" -ge 500 ]; then
            echo "::error::A rota de IA respondeu $status. O deployment subiu mas o BFF quebra em execução."
            exit 1
          fi

          if [ "$status" != "401" ]; then
            echo "::error::Esperado 401 (sem token) e veio $status. Se for 3xx ou HTML, a proteção da Vercel está barrando a rota."
            exit 1
          fi

          echo "✓ preview no ar, bypass funcionando e ambiente de servidor completo"

  # ─────────────────────────────────────────
  # 4. DEPLOY PRODUCTION (push em main ou tag)
  # ─────────────────────────────────────────
  deploy-production:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    environment: production
    needs: [validate, migrate]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/web/v')
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Pull Vercel project config
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Mesma regra do preview: só o que é inlinado. Ver ADR-0021.
      - name: Build (Production)
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PROD }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PROD }}

      - name: Deploy to Vercel (Production)
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ─────────────────────────────────────────
  # 4. GITHUB RELEASE (apenas tags)
  # ─────────────────────────────────────────
  github-release:
    name: 📝 GitHub Release
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/web/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --list 'web/v*' --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          NOTES=$(git log $RANGE --pretty=format:"- %s" --no-merges \
            | grep -E "^- (feat|fix|refactor|perf|docs|chore|test)(\(.+\))?:" \
            || echo "- Sem mudanças documentadas")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Eleva Pro Web ${{ github.ref_name }}"
          body: |
            ## ${{ github.ref_name }}

            ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
