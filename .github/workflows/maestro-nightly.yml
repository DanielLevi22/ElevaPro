name: Maestro E2E (noturno)

# ──────────────────────────────────────────────────────
# Os sete fluxos de `app/.maestro/` são os únicos testes que exercitam login,
# execução de treino e registro de refeição de ponta a ponta. Nunca rodaram
# automaticamente: existiam no repositório e em workflow nenhum.
#
# Noturno, e não por PR, de propósito: subir emulador, buildar o APK e rodar
# sete fluxos leva dezenas de minutos. Pendurar isso em cada PR trocaria uma
# suíte que não roda por uma suíte que todo mundo aprende a ignorar.
#
# Fora do `ci-success`: este workflow não bloqueia merge. Ele avisa que um
# caminho de usuário quebrou — o gate de PR continua sendo lint, tipos, testes
# unitários e build.
# ──────────────────────────────────────────────────────
on:
  schedule:
    # 06:00 UTC = 03:00 em Brasília, depois do merge do dia e antes do início.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: maestro-nightly
  cancel-in-progress: true

jobs:
  e2e:
    name: 📱 Fluxos Maestro (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: preview
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci
        working-directory: ./app

      # Os fluxos falam com o projeto Supabase de preview, não com produção:
      # eles criam aluno, registram treino e gravam refeição.
      - name: Gerar APK de debug
        run: npx expo prebuild --platform android --no-install && ./gradlew assembleDebug
        working-directory: ./app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL_DEV }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY_DEV }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL_PREVIEW }}

      - name: Instalar Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # `reactivecircus` cuida do emulador, do KVM e do boot; rodar `avdmanager`
      # à mão aqui só reimplementaria isso pior.
      - name: Rodar fluxos no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test app/.maestro --format junit --output maestro-report.xml
        env:
          MAESTRO_USUARIO: ${{ secrets.MAESTRO_USUARIO_PREVIEW }}
          MAESTRO_SENHA: ${{ secrets.MAESTRO_SENHA_PREVIEW }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/**
          retention-days: 14

      - name: Resumo
        if: always()
        run: |
          echo "### 📱 Maestro E2E" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ambiente: \`preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fluxos: \`app/.maestro/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
