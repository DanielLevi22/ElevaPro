name: Release App

# ──────────────────────────────────────────────────────
# Triggers:
#   develop (app/** changes) → EAS preview build (staging)
#   main    (app/** changes) → EAS production build
#   app/vX.Y.Z              → production + Google Play + GitHub Release
# ──────────────────────────────────────────────────────
on:
  push:
    branches:
      - development
      - main
    paths:
      - "app/**"
    tags:
      - "app/v*.*.*"
  # Build sob demanda. O gatilho de push exige mudança em app/**, então não havia
  # como gerar um binário para testar sem commit artificial — e re-executar um run
  # antigo usa a versão do workflow daquele commit, não a atual.
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # 1. VALIDATE
  # ─────────────────────────────────────────
  validate:
    name: ✅ Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:coverage -- --ci
        env:
          CI: true
          # Valores explícitos, não segredos: o teste não fala com Supabase de
          # verdade — o duplo do cliente responde por ele. Segredo fantasma aqui
          # chegava vazio e parecia configuração (ADR-0021).
          EXPO_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: chave-de-teste

  # ─────────────────────────────────────────
  # 2. BUILD PREVIEW (push em develop)
  # ─────────────────────────────────────────
  build-preview:
    name: 📦 EAS Preview Build (Staging)
    runs-on: ubuntu-latest
    # `environment: preview` fica pelo EXPO_TOKEN, que é secret de ambiente.
    # As variáveis do app vêm do environment do EAS, não daqui (ADR-0021).
    environment: preview
    needs: validate
    if: github.ref == 'refs/heads/development'
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build → preview
        run: eas build --platform android --profile preview --non-interactive
        # Sem `env:` de propósito. O `eas.json` declara `environment: preview` no
        # perfil, e o EAS injeta as variáveis daquele environment — confira com
        # `eas env:list --environment preview`.
        #
        # As linhas que moravam aqui passavam nomes com sufixo
        # (`EXPO_PUBLIC_SUPABASE_URL_PREVIEW`) que o código nunca leu: ele lê
        # `EXPO_PUBLIC_SUPABASE_URL`, sem sufixo. Nunca tiveram efeito, e o
        # comentário ao lado jurava que sem elas o binário saía sem IA. Ver
        # ADR-0021.

  # ─────────────────────────────────────────
  # 3. BUILD PRODUCTION (push em main OU tag)
  # ─────────────────────────────────────────
  build-production:
    name: 🚀 EAS Production Build
    runs-on: ubuntu-latest
    environment: production
    needs: validate
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/app/v')
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Antes de gastar um build de produção, e antes de um APK errado chegar a
      # alguém. `EXPO_PUBLIC_*` é inlinada no bundle: variável faltando ou
      # apontando para preview vira binário publicado com o banco errado, e não
      # se conserta sem build novo (ADR-0021).
      - name: Conferir o environment production do EAS
        run: |
          set -euo pipefail
          lista=$(eas env:list --environment production --format short 2>/dev/null || eas env:list --environment production)
          faltando=""
          for nome in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_API_URL; do
            echo "$lista" | grep -q "$nome" || faltando="$faltando $nome"
          done

          if [ -n "$faltando" ]; then
            echo "::error::Environment 'production' do EAS incompleto. Faltando:$faltando"
            echo "::error::Adicione com 'eas env:create --environment production --name <NOME> --value <VALOR>'."
            echo "::error::Devem apontar para o Supabase e o domínio de PRODUÇÃO — nunca os de preview."
            exit 1
          fi

          if echo "$lista" | grep -q 'elevapro-preview'; then
            echo "::error::O environment 'production' aponta para o domínio de preview."
            exit 1
          fi
          echo "✓ environment production completo"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Sem `env:`: o perfil `production` do eas.json declara
      # `environment: production`, e o EAS injeta as variáveis de lá.
      - name: EAS Build → production
        run: eas build --platform android --profile production --non-interactive

  # ─────────────────────────────────────────
  # 4. SUBMIT TO GOOGLE PLAY (apenas tags)
  # ─────────────────────────────────────────
  submit:
    name: 📲 Submit to Google Play
    runs-on: ubuntu-latest
    environment: production
    needs: build-production
    if: startsWith(github.ref, 'refs/tags/app/v')
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Submit → Internal Track
        run: eas submit --platform android --profile production --latest --non-interactive

  # ─────────────────────────────────────────
  # 5. GITHUB RELEASE (apenas tags)
  # ─────────────────────────────────────────
  github-release:
    name: 📝 GitHub Release
    runs-on: ubuntu-latest
    needs: build-production
    if: startsWith(github.ref, 'refs/tags/app/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --list 'app/v*' --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          NOTES=$(git log $RANGE --pretty=format:"- %s" --no-merges \
            | grep -E "^- (feat|fix|refactor|perf|docs|chore|test)(\(.+\))?:" \
            || echo "- Sem mudanças documentadas")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Eleva Pro App ${{ github.ref_name }}"
          body: |
            ## ${{ github.ref_name }}

            ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
