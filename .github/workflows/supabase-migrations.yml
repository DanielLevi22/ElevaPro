name: Supabase Migrations

# ──────────────────────────────────────────────────────
# Aplica migrations no projeto Supabase do ambiente correspondente.
#
#   development → projeto Preview     (automático)
#   main        → projeto Production  (exige aprovação, ver README abaixo)
#
# Dois gatilhos de propósito:
#   push          → mudança que só toca supabase/ (release-web não dispara nisso)
#   workflow_call → invocado pelo release-web, para o deploy esperar a migration
#
# A ordem importa: código novo contra schema velho quebra em runtime, e não há
# conserto rápido. Por isso o deploy declara `needs` neste job.
# ──────────────────────────────────────────────────────
on:
  push:
    branches:
      - development
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "scripts/verify-rls.sql"
  workflow_call:
  # Permite reverificar um ambiente sem push. `db push` é forward-only e a
  # verificação não escreve nada, então rodar de novo é seguro.
  workflow_dispatch:

# Serializa: um push que toca web/** e supabase/** dispara este workflow pelas
# duas vias. `db push` é idempotente, mas execuções concorrentes disputariam o
# advisory lock do Postgres.
concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: 🗄️ Apply migrations
    runs-on: ubuntu-latest
    # Secrets são escopados por environment: mesmos nomes, valores distintos.
    # Impede um run de preview enxergar credencial de produção.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Sem isto, secret ausente vira `--db-url ""` e o CLI tenta o socket
      # local do runner; string Direct falha com ECONNREFUSED num IPv6. Os
      # dois erros são ilegíveis para quem só esqueceu de configurar o secret.
      - name: Validar connection string
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "❌ SUPABASE_DB_URL não configurado no environment '$ENVIRONMENT'."
            echo "   Settings → Environments → $ENVIRONMENT → Add secret"
            exit 1
          fi

          # Direct connection é IPv6-only; runners do GitHub são IPv4.
          case "$SUPABASE_DB_URL" in
            *db.*.supabase.co*)
              echo "❌ SUPABASE_DB_URL usa a Direct connection (db.<ref>.supabase.co)."
              echo "   Ela é IPv6-only e os runners do GitHub são IPv4."
              echo "   Use a string do Session pooler:"
              echo "   postgresql://postgres.<ref>:<senha>@aws-0-<regiao>.pooler.supabase.com:5432/postgres"
              exit 1
              ;;
          esac

          echo "✓ Connection string via pooler."
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}

      # `--db-url` dispensa link, access token e project ref: a connection
      # string já carrega host, projeto e senha. Um secret em vez de quatro.
      #
      # Use a string do **Session pooler**, não a "Direct connection" — conexão
      # direta do Supabase é IPv6-only e os runners do GitHub são IPv4.
      #
      # Forward-only: aplica só o que está pendente, comparando com
      # supabase_migrations.schema_migrations no remoto. Não há rollback —
      # migration ruim se corrige com migration nova.
      - name: Aplicar migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # `db push` não roda seed. O arquivo é idempotente (guard `where not
      # exists`), então re-executar a cada deploy não duplica.
      - name: Aplicar seed
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # `db push` responder "success" só diz que o SQL rodou. Não diz que a
      # política se comporta igual aqui: local nasce de `db reset`, com tudo do
      # mesmo dono; preview e produção nascem do painel e recebem só o pendente,
      # sobre objetos com outro dono e outro `pg_default_acl`. A migration 0020
      # existe por causa dessa diferença.
      #
      # Este passo assume o papel `authenticated` com as claims do PostgREST e
      # afirma o isolamento no banco de verdade, dentro de uma transação que
      # termina em ROLLBACK.
      - name: Verificar RLS no ambiente
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/verify-rls.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Resumo
        run: |
          echo "### 🗄️ Migrations aplicadas" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ambiente: \`${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- RLS verificada no banco, não só aplicada" >> "$GITHUB_STEP_SUMMARY"
