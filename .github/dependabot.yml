version: 2
updates:
  # Dependências da raiz (husky, commitlint, biome)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3

  # Dependências do app mobile
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    groups:
      expo-packages:
        patterns:
          - "expo*"
          - "@expo/*"
      # Só patches: minor e major das libs nativas ficam ignorados lá embaixo
      react-native-packages:
        patterns:
          - "react-native*"
          - "@react-native/*"
      testing:
        patterns:
          - "jest*"
          - "@types/jest"
          - "@testing-library/*"
    ignore:
      # Major updates precisam de revisão manual
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      # No 0.x o minor é que quebra, e a versão do RN é amarrada ao SDK do Expo
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # As libs nativas também seguem o SDK: o #400 trouxe reanimated, worklets e
      # screens do SDK 58 com o app no 57, e majors como o gesture-handler 3.
      # Minor e major delas chegam com o SDK; aqui passa só patch (#402)
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      # O major dos expo-* é o número do SDK: subir sem o `expo` mistura SDKs (#391).
      # Troca de SDK é pelo `npx expo install expo@^N --fix`, não pelo Dependabot
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      # NativeWind 4 só aceita Tailwind 3; o v4 derrubou o Metro (#395)
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
