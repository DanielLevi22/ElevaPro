function DashboardPage({ theme, setTheme }) {
  const ACTIVITIES = [
    { icon: "check-circle-2", tone: "hsl(var(--success))", name: "João Silva", desc: "Concluiu o treino Costas & Bíceps", time: "há 12 min" },
    { icon: "user-plus", tone: "hsl(var(--primary-text))", name: "Marcos Lima", desc: "Foi adicionado como novo aluno", time: "há 2 h" },
    { icon: "plus", tone: "hsl(var(--accent))", name: "Ana Costa", desc: "Recebeu uma nova dieta: Cutting Fase 2", time: "há 5 h" },
    { icon: "check-circle-2", tone: "hsl(var(--success))", name: "Beatriz Souza", desc: "Concluiu o treino Pernas — Completo", time: "há 1 dia" },
  ];
  const QUICK_ACTIONS = [
    { title: "Adicionar Aluno", icon: "user-plus", tone: "primary-text" },
    { title: "Criar Treino", icon: "dumbbell", tone: "secondary" },
    { title: "Criar Dieta", icon: "utensils", tone: "accent" },
    { title: "Relatórios", icon: "bar-chart-3", tone: "primary-text" },
  ];
  const SPARK = { students: [40, 44, 46, 50, 55, 60, 62], workouts: [60, 62, 61, 65, 70, 72, 78], diets: [30, 32, 35, 33, 40, 42, 45], completed: [4, 6, 5, 7, 8, 7, 9] };

  function Sparkline({ data, color }) {
    const max = Math.max(...data), min = Math.min(...data);
    const pts = data.map((v, i) => `${(i / (data.length - 1)) * 100},${30 - ((v - min) / (max - min || 1)) * 28}`).join(" ");
    return (
      <svg viewBox="0 0 100 30" style={{ width: "100%", height: 30, display: "block" }} preserveAspectRatio="none">
        <polyline points={pts} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );
  }

  function HeroStat({ label, value, spark, color, icon }) {
    return (
      <div style={{ background: "hsl(var(--surface))", border: "1px solid hsl(var(--border))", borderRadius: "var(--radius-xl)", padding: 20, position: "relative", overflow: "hidden" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
          <div>
            <div style={{ fontSize: 11, color: "hsl(var(--muted-foreground))", fontWeight: 600, marginBottom: 6 }}>{label}</div>
            <div style={{ fontFamily: "var(--font-display)", fontSize: 32, fontWeight: 800, color: "hsl(var(--foreground))" }}>{value}</div>
          </div>
          <div style={{ color, background: `${color.replace(")", " / 0.12)")}`, width: 36, height: 36, borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{I(icon, 17)}</div>
        </div>
        <Sparkline data={spark} color={color} />
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 28 }}>
        <div>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 34, fontWeight: 800, background: "linear-gradient(90deg, hsl(var(--primary)), hsl(var(--secondary)), hsl(var(--accent)))", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", backgroundClip: "text" }}>Dashboard</div>
          <div style={{ fontSize: 13, color: "hsl(var(--muted-foreground))", marginTop: 8 }}>Bem-vindo de volta, <span style={{ color: "hsl(var(--foreground))", fontWeight: 600 }}>Daniel</span>! · <span style={{ textTransform: "capitalize" }}>terça-feira, 12 de agosto</span></div>
        </div>
        <ThemeToggle theme={theme} setTheme={setTheme} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 16, marginBottom: 20 }}>
        <HeroStat label="Total de Alunos" value="24" spark={SPARK.students} color="hsl(var(--primary-text))" icon="users" />
        <HeroStat label="Treinos Criados" value="47" spark={SPARK.workouts} color="hsl(var(--secondary))" icon="dumbbell" />
        <HeroStat label="Dietas Ativas" value="18" spark={SPARK.diets} color="hsl(var(--accent))" icon="utensils" />
        <HeroStat label="Concluídos (7d)" value="9" spark={SPARK.completed} color="hsl(var(--primary-text))" icon="trending-up" />
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {QUICK_ACTIONS.map((a) => (
          <button key={a.title} style={{ flex: 1, display: "flex", alignItems: "center", gap: 10, background: `hsl(var(--${a.tone}) / 0.06)`, border: `1px solid hsl(var(--${a.tone}) / 0.25)`, borderRadius: 999, padding: "10px 16px", cursor: "pointer" }}>
            <span style={{ color: `hsl(var(--${a.tone}))` }}>{I(a.icon, 15)}</span>
            <span style={{ fontSize: 12.5, fontWeight: 700, color: `hsl(var(--${a.tone}))`, whiteSpace: "nowrap" }}>{a.title}</span>
          </button>
        ))}
      </div>

      <div style={{ background: "hsl(var(--surface))", border: "1px solid hsl(var(--border))", borderRadius: "var(--radius-lg)", padding: 22 }}>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 15, color: "hsl(var(--foreground))", marginBottom: 14 }}>Atividades Recentes</div>
        <div style={{ display: "flex", flexDirection: "column" }}>
          {ACTIVITIES.map((a, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 4px", borderBottom: i < ACTIVITIES.length - 1 ? "1px solid hsl(var(--border))" : "none" }}>
              <div style={{ padding: 9, borderRadius: "50%", background: `${a.tone.replace(")", " / 0.1)")}`, color: a.tone, flexShrink: 0 }}>{I(a.icon, 15)}</div>
              <div style={{ flex: 1, minWidth: 0, display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12 }}>

                  <span style={{ fontSize: 12, color: "hsl(var(--muted-foreground))" }}> — {a.desc}</span>

                <span style={{ fontSize: 11, color: "hsl(var(--muted-foreground))", flexShrink: 0 }}>{a.time}</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function MacroRing({ label, value, max, color, size = 56 }) {
  const pct = Math.min(100, (value / max) * 100);
  const r = size / 2 - 5, c = 2 * Math.PI * r;
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
      <div style={{ position: "relative", width: size, height: size }}>
        <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={size / 2} cy={size / 2} r={r} stroke="hsl(var(--overlay-08))" strokeWidth="5" fill="none" />
          <circle cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth="5" fill="none" strokeDasharray={c} strokeDashoffset={c - (pct / 100) * c} strokeLinecap="round" />
        </svg>
        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, color: "hsl(var(--foreground))" }}>{value}</div>
      </div>
      <span style={{ fontSize: 10, color: "hsl(var(--muted-foreground))", fontWeight: 700, textTransform: "uppercase" }}>{label}</span>

}

              <input type="number" value={weight} onChange={(e) => setWeight(Number(e.target.value))} style={{ width: "100%", padding: "11px 12px", borderRadius: "var(--radius-lg)", border: "1px solid hsl(var(--border))", background: "hsl(var(--background))", color: "hsl(var(--foreground))", fontSize: 13, boxSizing: "border-box" }} />
            </div>
            <div>
              <div style={{ fontSize: 10, fontWeight: 800, color: "hsl(var(--muted-foreground))", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>Nível de Atividade</div>
              <select value={activity} onChange={(e) => setActivity(e.target.value)} style={{ width: "100%", padding: "11px 12px", borderRadius: "var(--radius-lg)", border: "1px solid hsl(var(--border))", background: "hsl(var(--background))", color: "hsl(var(--foreground))", fontSize: 13, boxSizing: "border-box" }}>
                {Object.keys(ACTIVITY).map((k) => <option key={k} value={k}>{ACTIVITY[k][0]}</option>)}
              </select>
            </div>
            <div>
              <div style={{ fontSize: 10, fontWeight: 800, color: "hsl(var(--muted-foreground))", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>Objetivo</div>
              <select value={goal} onChange={(e) => setGoal(e.target.value)} style={{ width: "100%", padding: "11px 12px", borderRadius: "var(--radius-lg)", border: "1px solid hsl(var(--border))", background: "hsl(var(--background))", color: "hsl(var(--foreground))", fontSize: 13, boxSizing: "border-box" }}>
                {Object.keys(GOALS).map((k) => <option key={k} value={k}>{GOALS[k][0]}</option>)}
              </select>
            </div>
          </div>
          <div style={{ display: "flex", gap: 28, alignItems: "flex-end", marginBottom: 18 }}>
            <div><div style={{ fontSize: 9.5, color: "hsl(var(--muted-foreground))", fontWeight: 700, textTransform: "uppercase" }}>TMB</div><div style={{ fontSize: 16, fontWeight: 800, color: "hsl(var(--foreground))" }}>{bmr} kcal</div></div>
            <div><div style={{ fontSize: 9.5, color: "hsl(var(--muted-foreground))", fontWeight: 700, textTransform: "uppercase" }}>GET</div><div style={{ fontSize: 16, fontWeight: 800, color: "hsl(var(--foreground))" }}>{tdee} kcal</div></div>
            {calOverride !== null && calOverride !== suggestedCalories && (
              <button onClick={() => setCalOverride(null)} style={{ background: "none", border: "none", color: "hsl(var(--primary-text))", fontSize: 11, fontWeight: 700, cursor: "pointer", padding: 0 }}>Usar sugestão ({suggestedCalories} kcal)</button>
            )}
          </div>
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
              <span style={{ fontSize: 10, fontWeight: 800, color: "hsl(var(--muted-foreground))", textTransform: "uppercase", letterSpacing: "0.1em" }}>Meta Diária (ajustável)</span>
              <input type="number" value={targetCalories} onChange={(e) => setCalOverride(Number(e.target.value))} style={{ width: 90, textAlign: "right", padding: "4px 8px", borderRadius: 8, border: "1px solid hsl(var(--border))", background: "hsl(var(--background))", color: "hsl(var(--primary-text))", fontSize: 15, fontWeight: 800, boxSizing: "border-box" }} />
            </div>
            <input type="range" min="1200" max="5000" step="25" value={targetCalories} onChange={(e) => setCalOverride(Number(e.target.value))} style={{ width: "100%", accentColor: "hsl(var(--primary))" }} />
          </div>
        </div>

        <div style={{ padding: "22px 0", borderBottom: "1px solid hsl(var(--border))" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "hsl(var(--muted-foreground))", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 16 }}>Distribuição de Macronutrientes</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 20 }}>
            <div>
              <div style={{ fontSize: 10, fontWeight: 800, color: "hsl(var(--muted-foreground))", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>Proteína (g/kg)</div>
              <input type="number" step="0.1" value={proteinPerKg} onChange={(e) => setProteinPerKg(Number(e.target.value))} style={{ width: "100%", padding: "11px 12px", borderRadius: "var(--radius-lg)", border: "1px solid hsl(var(--border))", background: "hsl(var(--background))", color: "hsl(var(--foreground))", fontSize: 13, boxSizing: "border-box" }} />
            </div>
            <div>
              <div style={{ fontSize: 10, fontWeight: 800, color: "hsl(var(--muted-foreground))", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>Gordura (g/kg)</div>
              <input type="number" step="0.1" value={fatPerKg} onChange={(e) => setFatPerKg(Number(e.target.value))} style={{ width: "100%", padding: "11px 12px", borderRadius: "var(--radius-lg)", border: "1px solid hsl(var(--border))", background: "hsl(var(--background))", color: "hsl(var(--foreground))", fontSize: 13, boxSizing: "border-box" }} />
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <MacroBar label="Proteína" grams={protein} kcalPerG={4} totalKcal={targetCalories} color="hsl(160 84% 45%)" />
            <MacroBar label="Carboidratos" grams={carbs} kcalPerG={4} totalKcal={targetCalories} color="hsl(217 91% 60%)" />
            <MacroBar label="Gordura" grams={fat} kcalPerG={9} totalKcal={targetCalories} color="hsl(38 92% 50%)" />
          </div>
          <div style={{ fontSize: 11, color: "hsl(var(--muted-foreground))", marginTop: 12, fontStyle: "italic" }}>Carboidratos calculados por diferença a partir da meta calórica.</div>
        </div>

        <div style={{ padding: "22px 0" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "hsl(var(--muted-foreground))", textTransform: "uppercase", letterSpacing: "0.1em" }}>Previsão Semanal</div>
            <span style={{ fontSize: 10.5, color: "hsl(var(--primary-text))", fontWeight: 700 }}>{strategy === "carb_cycling" ? "Carb Cycling ativo" : DIET_STRATEGIES[strategy].label}</span>
          </div>
          <div style={{ fontSize: 11.5, color: "hsl(var(--muted-foreground))", marginBottom: 16 }}>Como a meta calórica se distribui ao longo dos dias com essa estratégia.</div>
          <div style={{ display: "flex", gap: 6 }}>
            {WEEK_PREVIEW.map((d) => {
              const maxKcal = Math.max(...WEEK_PREVIEW.map((x) => x.kcal));
              const h = Math.round((d.kcal / maxKcal) * 64);
              return (
                <div key={d.day} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
                  <div style={{ fontSize: 12, fontWeight: 800, color: "hsl(var(--foreground))" }}>{d.kcal}</div>
                  <div style={{ width: "100%", maxWidth: 34, height: 64, display: "flex", alignItems: "flex-end", background: "hsl(var(--overlay-05))", borderRadius: 6, overflow: "hidden" }}>
                    <div style={{ width: "100%", height: h, background: d.weekend ? "hsl(38 92% 50%)" : "hsl(var(--primary))" }} />
                  </div>
                  <div style={{ fontSize: 10.5, fontWeight: 700, color: "hsl(var(--foreground))" }}>{d.day}</div>
                  <div style={{ fontSize: 9, color: "hsl(var(--muted-foreground))" }}>{d.label}</div>
                </div>
              );
            })}
          </div>
        </div>

        <div style={{ padding: "22px 0" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "hsl(var(--muted-foreground))", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 16 }}>Vigência</div>
          <div style={{ display: "flex", gap: 12 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 10, fontWeight: 800, color: "hsl(var(--muted-foreground))", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>Início da Vigência</div>
              <input type="date" defaultValue="2026-08-09" style={{ width: "100%", padding: "11px 12px", borderRadius: "var(--radius-lg)", border: "1px solid hsl(var(--border))", background: "hsl(var(--background))", color: "hsl(var(--foreground))", fontSize: 13, boxSizing: "border-box" }} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 10, fontWeight: 800, color: "hsl(var(--muted-foreground))", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>Fim da Vigência</div>
              <input type="date" defaultValue="2026-09-09" style={{ width: "100%", padding: "11px 12px", borderRadius: "var(--radius-lg)", border: "1px solid hsl(var(--border))", background: "hsl(var(--background))", color: "hsl(var(--foreground))", fontSize: 13, boxSizing: "border-box" }} />
            </div>
          </div>
        </div>

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, paddingTop: 22 }}>
          <Button variant="outline" onClick={onBack}>Cancelar</Button>
          <Button variant="primary" onClick={onBack}>Criar Plano e Montar Refeições</Button>
        </div>
      </div>
    </div>
  );
}

function NutritionPage({ theme, setTheme }) {
  const [crumb, setCrumb] = React.useState([{ view: "list" }]);
  const [pickerOpen, setPickerOpen] = React.useState(false);
  const [statusOpen, setStatusOpen] = React.useState(false);
  React.useEffect(() => { window.lucide?.createIcons(); }, [crumb, pickerOpen, statusOpen]);
  const cur = crumb[crumb.length - 1];
  const push = (c) => setCrumb([...crumb, c]);
  const goTo = (i) => setCrumb(crumb.slice(0, i + 1));

  const Breadcrumb = () => (
    <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "hsl(var(--muted-foreground))", marginBottom: 16 }}>
      {crumb.map((c, i) => (
        <React.Fragment key={i}>
          {i > 0 && <span>/</span>}
          <span onClick={() => goTo(i)} style={{ cursor: i < crumb.length - 1 ? "pointer" : "default", color: i === crumb.length - 1 ? "hsl(var(--foreground))" : "inherit", fontWeight: i === crumb.length - 1 ? 700 : 400 }}>{c.label || "Dietas"}</span>
        </React.Fragment>
      ))}
    </div>
  );

  if (cur.view === "list") {
    return (
      <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 24, flexWrap: "wrap", gap: 14 }}>
          <div>
            <div style={{ fontFamily: "var(--font-display)", fontSize: 30, fontWeight: 800, backgroundImage: "linear-gradient(90deg, hsl(var(--primary)), hsl(var(--secondary)), hsl(var(--accent)))", WebkitBackgroundClip: "text", backgroundClip: "text", color: "transparent" }}>Dietas e Nutrição</div>
            <div style={{ fontSize: 13, color: "hsl(var(--muted-foreground))", marginTop: 6 }}>Gerencie os planos alimentares dos seus alunos</div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <Button variant="outline" size="sm" icon={I("upload", 14)}>Importar Dieta</Button>
            <Button variant="primary" size="sm" icon={I("plus", 14)} onClick={() => push({ view: "create" })}>Criar Plano</Button>
            <ThemeToggle theme={theme} setTheme={setTheme} />
          </div>
        </div>

        <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
          <div style={{ flex: 1, position: "relative" }}>
            <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "hsl(var(--muted-foreground))" }}>{I("search", 15)}</span>
            <input placeholder="Buscar por nome ou aluno..." style={{ width: "100%", padding: "11px 12px 11px 36px", borderRadius: 10, border: "1px solid hsl(var(--border))", background: "hsl(var(--surface))", color: "hsl(var(--foreground))", fontSize: 13, boxSizing: "border-box" }} />
          </div>
          <select style={{ width: 180, background: "hsl(var(--surface))", border: "1px solid hsl(var(--border))", borderRadius: 10, padding: "0 12px", color: "hsl(var(--foreground))", fontSize: 13 }}>
            <option>Todos os alunos</option>
            {DIETS.map((d) => <option key={d.id}>{d.student}</option>)}
          </select>
          <select style={{ width: 140, background: "hsl(var(--surface))", border: "1px solid hsl(var(--border))", borderRadius: 10, padding: "0 12px", color: "hsl(var(--foreground))", fontSize: 13 }}>
            <option>Todos os tipos</option>
            <option>Dieta Única</option>
            <option>Dieta Cíclica</option>
          </select>
          <div style={{ display: "flex", gap: 6 }}>
            {["Todas", "Ativas", "Rascunhos", "Concluídas"].map((f, i) => (
              <button key={f} style={{ padding: "0 14px", borderRadius: 10, fontSize: 12.5, fontWeight: 700, cursor: "pointer", border: "1px solid " + (i === 0 ? "transparent" : "hsl(var(--border))"), background: i === 0 ? "hsl(var(--primary))" : "hsl(var(--surface))", color: i === 0 ? "hsl(var(--primary-foreground))" : "hsl(var(--muted-foreground))" }}>{f}</button>
            ))}
          </div>
        </div>

        <div style={{ background: "hsl(var(--surface))", border: "1px solid hsl(var(--border))", borderRadius: "var(--radius-lg)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "9px 16px", borderBottom: "1px solid hsl(var(--border))", fontSize: 10, fontWeight: 700, color: "hsl(var(--muted-foreground))", textTransform: "uppercase", letterSpacing: "0.08em" }}>
            <div style={{ flex: 1 }}>Plano</div>
            <div style={{ width: 90 }}>Tipo</div>
            <div style={{ width: 150 }}>Macros</div>
            <div style={{ width: 130 }}>Período</div>
            <div style={{ width: 90 }}>Status</div>
            <div style={{ width: 30 }} />
          </div>
          {DIETS.map((d, i) => (
            <div key={d.id} onClick={() => push({ view: "diet", data: d, label: d.name })} style={{ display: "flex", alignItems: "center", gap: 12, padding: "11px 16px", borderBottom: i < DIETS.length - 1 ? "1px solid hsl(var(--border))" : "none", cursor: "pointer" }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: 12.5, color: "hsl(var(--foreground))" }}>{d.name}</div>
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 2 }}>
                  <Avatar name={d.student} size="sm" />
                  <span style={{ fontSize: 11, color: "hsl(var(--muted-foreground))" }}>{d.student}</span>
                </div>
              </div>
              <div style={{ width: 90, fontSize: 11.5, color: "hsl(var(--muted-foreground))" }}>{d.type === "unique" ? "Única" : "Cíclica"}</div>
              <div style={{ width: 150, fontSize: 11, color: "hsl(var(--muted-foreground))" }}>{d.calories} kcal · P{d.protein} C{d.carbs} G{d.fat}</div>
              <div style={{ width: 130, fontSize: 11.5, color: "hsl(var(--muted-foreground))" }}>{d.start} → {d.end}</div>
              <div style={{ width: 90 }}><DietStatusPill status={d.status} /></div>
              <div style={{ width: 30, display: "flex", justifyContent: "flex-end" }}>
                <button onClick={(e) => e.stopPropagation()} style={{ background: "none", border: "none", color: "hsl(var(--muted-foreground))", cursor: "pointer", padding: 4 }} title="Excluir">{I("trash-2", 15)}</button>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  if (cur.view === "create") {
    return <DietCreatorPage onBack={() => goTo(0)} theme={theme} setTheme={setTheme} />;
  }

  if (cur.view === "diet") {
    const d = cur.data;
    return (
      <div>
        <Breadcrumb />
        <button onClick={() => goTo(0)} style={{ background: "none", border: "none", cursor: "pointer", color: "hsl(var(--muted-foreground))", fontSize: 12.5, fontWeight: 600, display: "flex", alignItems: "center", gap: 6, marginBottom: 10, padding: 0 }}>{I("chevron-left", 14)}Voltar para Dietas</button>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24, flexWrap: "wrap", gap: 14 }}>
          <div>
            <div style={{ fontFamily: "var(--font-display)", fontSize: 26, fontWeight: 800, color: "hsl(var(--foreground))" }}>{d.name}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 14, marginTop: 8 }}>
              <div style={{ position: "relative" }}>
                <button onClick={() => setStatusOpen((v) => !v)} style={{ cursor: "pointer" }}><DietStatusPill status={d.status} /></button>
                {statusOpen && (
                  <div style={{ position: "absolute", top: "110%", left: 0, background: "hsl(var(--surface))", border: "1px solid hsl(var(--border))", borderRadius: 10, padding: 6, zIndex: 10, minWidth: 150, boxShadow: "var(--shadow-panel)" }}>
                    {Object.keys(DIET_STATUSES).map((s) => (
                      <div key={s} onClick={() => setStatusOpen(false)} style={{ padding: "7px 10px", borderRadius: 8, cursor: "pointer", fontSize: 12, fontWeight: 700, color: "hsl(var(--foreground))" }}>{DIET_STATUSES[s][0]}</div>
                    ))}
                  </div>
                )}
              </div>
              <span style={{ fontSize: 12.5, color: "hsl(var(--muted-foreground))", fontWeight: 600 }}>{d.start} - {d.end}</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 24, marginTop: 20, background: "hsl(var(--overlay-05))", border: "1px solid hsl(var(--border))", padding: 20, borderRadius: "var(--radius-xl)", width: "fit-content" }}>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", paddingRight: 20, borderRight: "1px solid hsl(var(--border))" }}>
                <div style={{ fontSize: 9.5, color: "hsl(var(--muted-foreground))", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.15em", marginBottom: 4 }}>Total Calórico</div>
                <div style={{ fontFamily: "var(--font-display)", fontSize: 28, fontWeight: 800, color: "hsl(var(--foreground))" }}>{d.calories}<span style={{ fontSize: 12, color: "hsl(var(--muted-foreground))" }}> kcal</span></div>
              </div>
              <div style={{ display: "flex", gap: 20 }}>
                <MacroRing label="Proteína" value={d.protein} max={300} color="hsl(160 84% 50%)" />
                <MacroRing label="Carbo" value={d.carbs} max={500} color="hsl(217 91% 65%)" />
                <MacroRing label="Gordura" value={d.fat} max={150} color="hsl(38 92% 55%)" />
              </div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <Button variant="outline" size="sm" icon={I("file-down", 14)}>Exportar PDF</Button>
            {d.type === "cyclic" && <Button variant="outline" size="sm" icon={I("calendar-cog", 14)}>Opções do Dia</Button>}
            <button style={{ width: 38, height: 38, borderRadius: 10, background: "hsl(var(--destructive) / 0.1)", border: "1px solid hsl(var(--destructive) / 0.2)", color: "hsl(var(--destructive))", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }} title="Excluir Plano">{I("trash-2", 16)}</button>
            <ThemeToggle theme={theme} setTheme={setTheme} />
          </div>
        </div>

        {d.type === "cyclic" && (
          <div style={{ display: "flex", gap: 6, marginBottom: 16, overflowX: "auto" }}>
            {["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"].map((day, i) => (
              <button key={day} style={{ padding: "8px 16px", borderRadius: 10, fontSize: 12.5, fontWeight: 700, cursor: "pointer", border: "none", background: i === 0 ? "hsl(var(--primary))" : "hsl(var(--surface))", color: i === 0 ? "hsl(var(--primary-foreground))" : "hsl(var(--muted-foreground))", flexShrink: 0 }}>{day}</button>
            ))}
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: "hsl(var(--foreground))" }}>Refeições</div>
          <button style={{ background: "none", border: "none", color: "hsl(var(--primary-text))", fontWeight: 700, fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>{I("plus", 14)}Nova Refeição</button>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {MEALS.map((m) => (
            <div key={m.id} style={{ background: "hsl(var(--surface))", border: "1px solid hsl(var(--border))", borderRadius: "var(--radius-lg)", overflow: "hidden" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 16px", background: "hsl(var(--overlay-05))" }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 13, color: "hsl(var(--foreground))" }}>{m.name}</div>
                  <div style={{ fontSize: 11, color: "hsl(var(--muted-foreground))" }}>{m.time}</div>
                </div>
                <button onClick={() => push({ view: "diet", data: d, label: d.name, addingTo: m.id }) || setPickerOpen(true)} style={{ fontSize: 11.5, fontWeight: 700, color: "hsl(var(--primary-text))", background: "hsl(var(--primary) / 0.1)", border: "none", borderRadius: 8, padding: "6px 12px", cursor: "pointer" }}>+ Adicionar</button>
              </div>
              {m.foods.length === 0 ? (
                <div style={{ padding: "14px 16px", fontSize: 12, color: "hsl(var(--muted-foreground))", fontStyle: "italic" }}>Nenhum alimento selecionado.</div>
              ) : (
                m.foods.map((f, i) => (
                  <div key={f.name} style={{ display: "flex", justifyContent: "space-between", padding: "10px 16px", borderTop: i > 0 ? "1px solid hsl(var(--border))" : "none" }}>
                    <div style={{ fontSize: 12.5, fontWeight: 600, color: "hsl(var(--foreground))" }}>{f.name} <span style={{ color: "hsl(var(--muted-foreground))", fontWeight: 400 }}>· {f.qty}</span></div>
                    <div style={{ fontSize: 11.5, color: "hsl(var(--muted-foreground))" }}>{f.kcal} kcal</div>
                  </div>
                ))
              )}
            </div>
          ))}
        </div>
        {pickerOpen && <FoodPicker onClose={() => setPickerOpen(false)} />}
      </div>
    );
  }
}

function CoachPage() {
  const msgs = [
    { from: "ai", text: "João tem 1 periodização em andamento. Continuamos?" },
    { from: "me", text: "Vamos montar os treinos da Fase 2" },
    { from: "ai", text: "Proposta: Treino A, B, C, D — 4x por semana, foco em hipertrofia." },
  ];
  return (
    <div style={{ maxWidth: 640 }}>
      <div style={{ fontFamily: "var(--font-display)", fontSize: 30, fontWeight: 800, color: "hsl(var(--foreground))", marginBottom: 20 }}>Assistente</div>
      <Card radius="var(--radius-2xl)" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        {msgs.map((m, i) => (
          <div key={i} style={{ display: "flex", justifyContent: m.from === "me" ? "flex-end" : "flex-start" }}>
            <div style={{
              maxWidth: "80%", padding: "10px 16px", borderRadius: 16, fontSize: 13,
              background: m.from === "me" ? "hsl(var(--primary))" : "hsl(var(--overlay-08))",
              color: m.from === "me" ? "hsl(var(--primary-foreground))" : "hsl(var(--foreground))",
            }}>{m.text}</div>
          </div>
        ))}
      </Card>
    </div>
  );
}

function App() {
  const [page, setPage] = React.useState("briefing");
  const [theme, setTheme] = React.useState("dark");
  const [collapsed, setCollapsed] = React.useState(false);
  const [openStudent, setOpenStudent] = React.useState(null);
  React.useEffect(() => { document.documentElement.className = theme === "light" ? "light" : ""; window.lucide?.createIcons(); }, [page, theme, collapsed, openStudent]);
  return (
    <div style={{ display: "flex", height: 900 }}>
      <Sidebar page={page} setPage={(k) => { setPage(k); setOpenStudent(null); }} collapsed={collapsed} setCollapsed={setCollapsed} />
      <main style={{ flex: 1, padding: "40px", overflow: "auto" }}>
        {openStudent ? (
          <StudentDetailPage student={openStudent} onBack={() => setOpenStudent(null)} theme={theme} setTheme={setTheme} />
        ) : (
          <React.Fragment>
            {page === "briefing" && <BriefingPage theme={theme} setTheme={setTheme} />}
            {page === "dashboard" && <DashboardPage theme={theme} setTheme={setTheme} />}
            {page === "students" && <StudentsPage theme={theme} setTheme={setTheme} onOpen={setOpenStudent} />}
            {page === "workouts" && <WorkoutsPage theme={theme} setTheme={setTheme} />}
            {page === "nutrition" && <NutritionPage theme={theme} setTheme={setTheme} />}
            {page === "coach" && <CoachPage />}
          </React.Fragment>
        )}
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
setTimeout(()=>window.lucide?.createIcons(), 50);
</script></body></html>
