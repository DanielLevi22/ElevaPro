<!-- @dsCard group="Type" viewport="700x220" name="Scale" subtitle="Display 32 / H1 24 / H2 20 / H3 16 / Body 14 / Small 12 / Micro 10" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{margin:0;padding:20px;background:hsl(var(--background));font-family:var(--font-display);color:hsl(var(--foreground));display:flex;flex-direction:column;gap:6px}
span{color:hsl(var(--zinc-500));font-family:var(--font-sans);font-size:11px;margin-left:10px}
</style></head><body>
<div style="font-size:var(--text-display);font-weight:800">Display <span>32px</span></div>
<div style="font-size:var(--text-h1);font-weight:700">Heading 1 <span>24px</span></div>
<div style="font-size:var(--text-h2);font-weight:700">Heading 2 <span>20px</span></div>
<div style="font-size:var(--text-h3);font-weight:700">Heading 3 <span>16px</span></div>
<div style="font-size:var(--text-body);font-family:var(--font-sans);font-weight:400">Body <span>14px</span></div>
<div style="font-size:var(--text-small);font-family:var(--font-sans)">Small <span>12px</span></div>
<div style="font-size:var(--text-micro);font-family:var(--font-sans);text-transform:uppercase;letter-spacing:0.2em">Micro <span>10px</span></div>
</body></html>
