<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{margin:0;padding:30px;background:hsl(var(--background));display:flex;gap:20px;align-items:center;font-family:var(--font-sans)}
button{border:none;border-radius:var(--radius-full);padding:14px 28px;background:hsl(var(--primary));color:#000;font-weight:700;font-size:14px;box-shadow:var(--glow-primary)}

</style></head><body>
<button>Começar Agora</button>
<div class="blob"></div>
