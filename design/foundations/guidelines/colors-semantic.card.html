<!-- @dsCard group="Colors" viewport="700x110" name="Semantic" subtitle="Success / Warning / Danger" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{margin:0;padding:20px;background:hsl(var(--background));display:flex;gap:12px;font-family:var(--font-sans)}
.chip{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--radius-full);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em}
.dot{width:8px;height:8px;border-radius:50%}
</style></head><body>
<div class="chip" style="background:hsl(var(--success)/0.1);color:hsl(var(--success));border:1px solid hsl(var(--success)/0.2)"><span class="dot" style="background:hsl(var(--success))"></span>Success</div>
<div class="chip" style="background:hsl(var(--warning)/0.1);color:hsl(var(--warning));border:1px solid hsl(var(--warning)/0.2)"><span class="dot" style="background:hsl(var(--warning))"></span>Warning</div>
<div class="chip" style="background:hsl(var(--destructive)/0.1);color:hsl(var(--destructive));border:1px solid hsl(var(--destructive)/0.2)"><span class="dot" style="background:hsl(var(--destructive))"></span>Danger</div>
</body></html>
