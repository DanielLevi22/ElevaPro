<!-- @dsCard group="Spacing" viewport="700x160" name="Space scale" subtitle="4px base increments" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{margin:0;padding:20px;background:hsl(var(--background));display:flex;align-items:flex-end;gap:10px;font-family:var(--font-mono);color:hsl(var(--zinc-500));font-size:10px}
.bar{background:hsl(var(--primary));width:24px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
</style></head><body>
<div class="col"><div class="bar" style="height:4px"></div>1</div>
<div class="col"><div class="bar" style="height:8px"></div>2</div>
<div class="col"><div class="bar" style="height:16px"></div>4</div>
<div class="col"><div class="bar" style="height:24px"></div>6</div>
<div class="col"><div class="bar" style="height:32px"></div>8</div>
<div class="col"><div class="bar" style="height:40px"></div>10</div>
<div class="col"><div class="bar" style="height:48px"></div>12</div>
<div class="col"><div class="bar" style="height:64px"></div>16</div>
</body></html>
