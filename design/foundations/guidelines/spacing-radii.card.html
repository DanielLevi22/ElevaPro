<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radii" subtitle="12 → 40px, pill for buttons/badges" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{margin:0;padding:20px;background:hsl(var(--background));display:flex;gap:14px;align-items:flex-end;font-family:var(--font-mono);color:hsl(var(--zinc-500));font-size:10px}
.box{width:64px;height:64px;background:hsl(var(--surface));border:1px solid hsl(var(--border))}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
</style></head><body>
<div class="col"><div class="box" style="border-radius:var(--radius-md)"></div>md 12</div>
<div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div>lg 16</div>
<div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div>xl 22</div>
<div class="col"><div class="box" style="border-radius:var(--radius-2xl)"></div>2xl 24</div>
<div class="col"><div class="box" style="border-radius:var(--radius-3xl)"></div>3xl 32</div>
<div class="col"><div class="box" style="border-radius:var(--radius-full);width:80px"></div>full</div>
</body></html>
