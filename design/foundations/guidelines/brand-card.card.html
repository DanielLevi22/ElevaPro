<!-- @dsCard group="Brand" viewport="700x220" name="Card surface" subtitle="Border brightens + glows on hover — no left-border accent pattern" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{margin:0;padding:24px;background:hsl(var(--background));display:flex;gap:16px;font-family:var(--font-sans)}
.card{flex:1;background:hsl(var(--surface));border:1px solid hsl(var(--border));border-radius:var(--radius-2xl);padding:20px;transition:border-color .3s}
.card:hover{border-color:hsl(var(--primary)/0.4);box-shadow:var(--shadow-card)}
h3{font-family:var(--font-display);color:#fff;margin:0 0 6px;font-size:18px}
p{color:hsl(var(--muted-foreground));font-size:13px;margin:0}
</style></head><body>
<div class="card"><h3>Treinos</h3><p>Fichas interativas com timer automático.</p></div>
<div class="card"><h3>Nutrição</h3><p>Dietas flexíveis para o seu metabolismo.</p></div>
</body></html>
