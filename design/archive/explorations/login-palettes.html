<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans)}
.frame{position:absolute;width:900px;height:1000px;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,0.6)}
.frame-label{position:absolute;top:-42px;left:0;font-family:var(--font-display);font-weight:800;font-size:20px;color:#111}
.phone{width:300px;height:640px;border-radius:36px;border:7px solid #000;background:hsl(var(--background));overflow:hidden;position:relative}
</style></head>
<body>
<template id="__bundler_thumbnail"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#CCFF00"/><text x="50" y="55" font-size="30" text-anchor="middle">EP</text></svg></template>

<div class="frame" style="left:0;top:80px;--primary:84 100% 50%;--secondary:184 100% 50%;--accent:324 100% 50%;--background:240 10% 3.9%;--surface:240 5.9% 10%;--border:240 3.7% 15.9%;--foreground:0 0% 98%;--muted-foreground:240 5% 64.9%;background:hsl(var(--background))">
<div class="frame-label">A — Lime Cyber (atual)</div>
<div id="a"></div>
</div>

<div class="frame" style="left:960px;top:80px;--primary:84 100% 50%;--secondary:240 5% 45%;--accent:240 5% 45%;--background:240 10% 3.9%;--surface:240 5.9% 10%;--border:240 3.7% 15.9%;--foreground:0 0% 98%;--muted-foreground:240 5% 64.9%;background:hsl(var(--background))">
<div class="frame-label">B — Volt Mono (só lime, sem azul/rosa)</div>
<div id="b"></div>
</div>

<div class="frame" style="left:1920px;top:80px;--primary:16 100% 60%;--secondary:199 89% 55%;--accent:16 100% 60%;--background:222 47% 8%;--surface:222 30% 13%;--border:222 20% 20%;--foreground:0 0% 98%;--muted-foreground:220 15% 65%;background:hsl(var(--background))">
<div class="frame-label">C — Ember Pro (laranja único, navy escuro)</div>
<div id="c"></div>
</div>

<script type="text/babel">
const { Button, Input, Card } = window.ElevaPro_ea5fe8;

function LoginCard(){
  const [tab, setTab] = React.useState("login");
  return (
    <div style={{display:"flex",justifyContent:"center",alignItems:"center",height:"100%",padding:40}}>
      <div style={{width:360}}>
        <div style={{fontFamily:"var(--font-display)",fontWeight:800,fontStyle:"italic",textTransform:"uppercase",fontSize:22,color:"hsl(var(--foreground))",marginBottom:28,textAlign:"center"}}>Eleva<span style={{color:"hsl(var(--primary))"}}> Pro</span></div>
        <Card radius="var(--radius-2xl)">
          <div style={{display:"flex",gap:4,background:"rgba(255,255,255,0.05)",borderRadius:"var(--radius-full)",padding:4,marginBottom:20}}>
            {["login","cadastro"].map(t=>(
              <button key={t} onClick={()=>setTab(t)} style={{flex:1,border:"none",borderRadius:"var(--radius-full)",padding:"8px 0",fontWeight:700,fontSize:12,textTransform:"uppercase",letterSpacing:"0.1em",cursor:"pointer",background:tab===t?"hsl(var(--primary))":"transparent",color:tab===t?"hsl(var(--primary-foreground))":"hsl(var(--muted-foreground))"}}>{t==="login"?"Entrar":"Cadastro"}</button>
            ))}
          </div>
          {tab==="cadastro" && <div style={{marginBottom:14}}><Input label="Nome" placeholder="Seu nome completo" /></div>}
          <div style={{marginBottom:14}}><Input label="Email" placeholder="voce@email.com" /></div>
          <div style={{marginBottom:20}}><Input label="Senha" type="password" placeholder="••••••••" /></div>
          <Button variant="primary" fullWidth size="lg">{tab==="login"?"Entrar":"Criar conta"}</Button>
          <div style={{textAlign:"center",fontSize:12,color:"hsl(var(--muted-foreground))",marginTop:16}}>
            {tab==="login" ? <>Não tem conta? <span style={{color:"hsl(var(--primary))",fontWeight:700}}>Cadastre-se</span></> : <>Já tem conta? <span style={{color:"hsl(var(--primary))",fontWeight:700}}>Entrar</span></>}
          </div>
        </Card>
      </div>
    </div>
  );
}

function MobileLogin(){
  const [tab, setTab] = React.useState("login");
  return (
    <div style={{padding:28,height:"100%",display:"flex",flexDirection:"column"}}>
      <div style={{fontFamily:"var(--font-display)",fontWeight:800,fontStyle:"italic",textTransform:"uppercase",fontSize:26,color:"hsl(var(--foreground))",marginTop:40,marginBottom:6}}>Eleva<span style={{color:"hsl(var(--primary))"}}> Pro</span></div>
      <div style={{color:"hsl(var(--muted-foreground))",fontSize:13,marginBottom:28}}>Acompanhamento que não para.</div>
      <div style={{display:"flex",gap:4,background:"rgba(255,255,255,0.05)",borderRadius:"var(--radius-full)",padding:4,marginBottom:20}}>
        {["login","cadastro"].map(t=>(
          <button key={t} onClick={()=>setTab(t)} style={{flex:1,border:"none",borderRadius:"var(--radius-full)",padding:"8px 0",fontWeight:700,fontSize:11,textTransform:"uppercase",cursor:"pointer",background:tab===t?"hsl(var(--primary))":"transparent",color:tab===t?"hsl(var(--primary-foreground))":"hsl(var(--muted-foreground))"}}>{t==="login"?"Entrar":"Cadastro"}</button>
        ))}
      </div>
      {tab==="cadastro" && <div style={{marginBottom:14}}><Input label="Nome" placeholder="Seu nome completo" /></div>}
      <div style={{marginBottom:14}}><Input label="Email" placeholder="voce@email.com" /></div>
      <div style={{marginBottom:20}}><Input label="Senha" type="password" placeholder="••••••••" /></div>
      <Button variant="primary" fullWidth size="lg">{tab==="login"?"Entrar":"Criar conta"}</Button>
    </div>
  );
}

function Frame(){
  return (
    <div style={{display:"flex",gap:60,alignItems:"center",height:"100%"}}>
      <div style={{flex:1,height:"100%"}}><LoginCard/></div>
      <div className="phone" style={{flexShrink:0}}><MobileLogin/></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("a")).render(<Frame/>);
ReactDOM.createRoot(document.getElementById("b")).render(<Frame/>);
ReactDOM.createRoot(document.getElementById("c")).render(<Frame/>);
</script>
</body></html>
