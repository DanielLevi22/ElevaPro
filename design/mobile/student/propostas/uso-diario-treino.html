<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../styles.css"><link rel="stylesheet" href="../../kit/glass.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
<style>
.scroll{flex:1;overflow:auto;padding:0 18px 12px;scrollbar-width:none;position:relative;z-index:2;margin-top:-52px;padding-top:52px}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="../../kit/kit.jsx"></script>
<script type="text/babel" src="uso-diario/pecas.jsx"></script>
<script type="text/babel" data-presets="react">
const I=(n,s=20,c)=><i data-lucide={n} style={{width:s,height:s,display:"block",color:c,flexShrink:0}}></i>;
const LIME="hsl(var(--primary))";
const IMG={back:"../../../foundations/assets/imagery/workout-back.jpg",arms:"../../../foundations/assets/imagery/workout-arms.jpg",chest:"../../../foundations/assets/imagery/workout-chest.jpg",legs:"../../../foundations/assets/imagery/workout-legs.jpg"};

function StatusBar(){
  return <div className="statusbar"><span>9:41</span><span style={{display:"flex",alignItems:"center",gap:6}}>{I("signal",16,"var(--on-hero)")}{I("wifi",16,"var(--on-hero)")}{I("battery-full",20,"var(--on-hero)")}</span></div>;
}
function RoundBtn({ icon, size=38 }){
  return <div className="glass" style={{width:size,height:size,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,background:"var(--hero-chip)",borderColor:"var(--hero-chip-brd)"}}>{I(icon,size*0.47,"var(--on-hero)")}</div>;
}
function HeroHeader({ eyebrow, title, right }){
  return (
    <div style={{paddingTop:14,display:"flex",alignItems:"center",gap:12}}>
      <RoundBtn icon="chevron-left" />
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:12,fontWeight:700,color:"var(--on-hero-2)",letterSpacing:".04em",textTransform:"uppercase"}}>{eyebrow}</div>
        <div style={{fontSize:22,fontWeight:700,color:"var(--on-hero)",letterSpacing:"-.03em",marginTop:2}}>{title}</div>
      </div>
      {right}
    </div>
  );
}
function SectionTitle({ children, action }){
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",margin:"20px 2px 10px"}}>
      <span style={{fontSize:10.5,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",color:"var(--ios-label3)"}}>{children}</span>
      {action && <span style={{fontSize:11.5,color:"var(--ios-label3)"}}>{action}</span>}
    </div>
  );
}
function Chip({ children, tone }){
  const on = tone==="primary";
  return <span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 10px",borderRadius:99,fontSize:10.5,fontWeight:800,textTransform:"uppercase",letterSpacing:".06em",background:on?LIME:"var(--glass-strong)",color:on?"#0d1a00":"var(--ios-label2)"}}>{children}</span>;
}
function Bar({ pct, color=LIME, h=6 }){
  return <div style={{height:h,borderRadius:99,background:"var(--glass-strong)",overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:99}} /></div>;
}

/* ---------- 0. Listagem de periodizações ---------- */
function PeriodizationsScreen({aluno}){
  const ACTIVE={name:"Ciclo 2026 · Verão",goal:"Hipertrofia",phase:"Fase 2 · Hipertrofia",week:"Semana 7 de 16",pct:44,coach:aluno?"Prescrito por Daniel Levi":"Proposta do Assistente · aprovada por você"};
  const OTHERS=[
    {name:"Base de Força",range:"jan – abr 2026",meta:"12 semanas · 3 fases",status:"Concluída",tone:"#34D399",pct:100},
    {name:"Recomposição",range:"set – dez 2025",meta:"16 semanas · 4 fases",status:"Concluída",tone:"#34D399",pct:100},
    {name:"Ciclo Outono",range:"a partir de 21 out",meta:"10 semanas · 2 fases",status:"Planejada",tone:"var(--ios-label3)",pct:0},
  ];
  return (
    <div className="scroll">
      <div style={{paddingTop:14,display:"flex",alignItems:"center",gap:12}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12,fontWeight:700,color:"var(--on-hero-2)",letterSpacing:".04em",textTransform:"uppercase"}}>Meus treinos</div>
          <div style={{fontSize:22,fontWeight:700,color:"var(--on-hero)",letterSpacing:"-.03em",marginTop:2}}>Periodizações</div>
        </div>
        <RoundBtn icon="search" /><RoundBtn icon="ellipsis" />
      </div>

      <div className="glass" style={{marginTop:18,padding:0,overflow:"hidden",borderColor:"color-mix(in srgb, hsl(var(--primary)) 50%, transparent)",boxShadow:`inset 0 1px 0 var(--spec), 0 18px 44px -18px ${LIME}, 0 4px 12px -4px rgba(0,0,0,.4)`}}>
        <div style={{position:"relative",height:132,backgroundImage:`linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.78)), url(${IMG.back})`,backgroundSize:"cover",backgroundPosition:"center 28%",padding:14,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{padding:"5px 10px",borderRadius:99,background:LIME,color:"#0d1a00",fontSize:9,fontWeight:800,letterSpacing:".12em",textTransform:"uppercase"}}>Em andamento</span>
            <span style={{padding:"5px 10px",borderRadius:99,background:"rgba(255,255,255,.16)",backdropFilter:"blur(10px)",color:"#fff",fontSize:9,fontWeight:800,letterSpacing:".12em",textTransform:"uppercase"}}>{ACTIVE.goal}</span>
          </div>
          <div>
            <div style={{fontFamily:"var(--font-display)",fontSize:21,fontWeight:800,color:"#fff",letterSpacing:"-.03em"}}>{ACTIVE.name}</div>
            <div style={{fontSize:11.5,color:"rgba(255,255,255,.8)",marginTop:3,display:"flex",alignItems:"center",gap:6}}>{I("user-round",12,"rgba(255,255,255,.8)")} {ACTIVE.coach} · {ACTIVE.phase}</div>
          </div>
        </div>
        <div style={{padding:"14px 15px 15px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}>
            <span style={{fontSize:13,fontWeight:700,color:"var(--ios-label)"}}>{ACTIVE.week}</span>
            <span style={{fontSize:12.5,fontWeight:700,color:"hsl(var(--primary-text))"}}>{ACTIVE.pct}%</span>
          </div>
          <Bar pct={ACTIVE.pct} />
          <div style={{display:"flex",gap:1,marginTop:13,borderRadius:14,overflow:"hidden",background:"var(--glass-strong)"}}>
            {[["3","Fases"],["48","Treinos"],["21","Restantes"],["92%","Aderência"]].map(([v,l])=>(
              <div key={l} style={{flex:1,padding:"9px 4px",textAlign:"center"}}>
                <div style={{fontFamily:"var(--font-display)",fontSize:14,fontWeight:800,color:"var(--ios-label)",letterSpacing:"-.02em"}}>{v}</div>
                <div style={{fontSize:8.5,fontWeight:700,letterSpacing:".12em",textTransform:"uppercase",color:"var(--ios-label3)",marginTop:2}}>{l}</div>
              </div>
            ))}
          </div>
          <div style={{height:44,marginTop:13,borderRadius:15,background:LIME,color:"#0d1a00",display:"flex",alignItems:"center",justifyContent:"center",gap:8,fontWeight:800,fontSize:13,letterSpacing:".12em",textTransform:"uppercase",boxShadow:`0 12px 28px -12px ${LIME}`}}>{I("arrow-right",17,"#0d1a00")} Continuar ciclo</div>
        </div>
      </div>

      <div style={{display:"flex",gap:7,marginTop:16}}>
        <Chip tone="primary">Todas · 4</Chip><Chip>Concluídas · 2</Chip><Chip>Planejadas · 1</Chip>
      </div>

      <SectionTitle action="Mais recentes">Histórico</SectionTitle>
      {OTHERS.map(p=>(
        <div key={p.name} className="glass" style={{padding:13,marginBottom:9,opacity:p.pct===0?.7:1}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:38,height:38,borderRadius:12,flexShrink:0,background:"var(--glass-strong)",display:"flex",alignItems:"center",justifyContent:"center"}}>{I(p.pct===100?"circle-check":"calendar-clock",18,p.tone)}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14.5,fontWeight:700,color:"var(--ios-label)",letterSpacing:"-.02em"}}>{p.name}</div>
              <div style={{fontSize:11.5,color:"var(--ios-label2)",marginTop:1}}>{p.range} · {p.meta}</div>
            </div>
            <span style={{fontSize:9.5,fontWeight:800,textTransform:"uppercase",letterSpacing:".08em",color:p.tone}}>{p.status}</span>
          </div>
        </div>
      ))}
      <div style={{height:120}}></div>
    </div>
  );
}

/* ---------- 1. Fases da periodização ---------- */
function PhasesScreen(){
  const PHASES=[
    {n:1,name:"Adaptação",range:"06 mai – 02 jun",status:"Concluída",tone:"#34D399",pct:100},
    {n:2,name:"Hipertrofia",range:"03 jun – 25 ago",status:"Em andamento",tone:LIME,pct:62},
    {n:3,name:"Força",range:"26 ago – 20 out",status:"Planejada",tone:"var(--ios-label3)",pct:0},
  ];
  return (
    <div className="scroll">
      <HeroHeader eyebrow="Periodização" title="Ciclo 2026 · Verão" right={<RoundBtn icon="ellipsis" />} />
      <div className="glass" style={{padding:16,marginTop:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:9}}>
          <span style={{fontSize:13.5,fontWeight:700,color:"var(--ios-label)"}}>Semana 7 de 16</span>
          <span style={{fontSize:12.5,color:"var(--ios-label2)"}}>44%</span>
        </div>
        <Bar pct={44} />
        <div style={{display:"flex",gap:18,marginTop:13}}>
          <span style={{fontSize:11.5,color:"var(--ios-label2)",display:"flex",alignItems:"center",gap:5}}>{I("layers",13,"var(--ios-label3)")} 3 fases</span>
          <span style={{fontSize:11.5,color:"var(--ios-label2)",display:"flex",alignItems:"center",gap:5}}>{I("dumbbell",13,"var(--ios-label3)")} 48 treinos</span>
          <span style={{fontSize:11.5,color:"var(--ios-label2)",display:"flex",alignItems:"center",gap:5}}>{I("sparkles",13,"var(--ios-label3)")} Proposta do Assistente</span>
        </div>
      </div>
      <SectionTitle>Fases</SectionTitle>
      {PHASES.map(p=>(
        <div key={p.n} className="glass" style={{padding:14,marginBottom:10,opacity:p.pct===0?.66:1}}>
          <div style={{display:"flex",alignItems:"center",gap:13}}>
            <div style={{width:40,height:40,borderRadius:13,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"var(--font-display)",fontWeight:800,fontSize:17,color:p.tone,background:"var(--glass-strong)"}}>{p.n}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:15.5,fontWeight:700,color:"var(--ios-label)",letterSpacing:"-.02em"}}>{p.name}</div>
              <div style={{fontSize:12,color:"var(--ios-label2)",marginTop:1}}>{p.range}</div>
            </div>
            <span style={{fontSize:10.5,fontWeight:800,textTransform:"uppercase",letterSpacing:".06em",color:p.tone}}>{p.status}</span>
          </div>
          {p.pct>0 && <div style={{marginTop:11}}><Bar pct={p.pct} color={p.tone} h={4} /></div>}
        </div>
      ))}
      <div style={{height:100}}></div>
    </div>
  );
}

/* ---------- 2. Fase ativa — treino do dia ---------- */
function PhaseScreen(){
  const WK=[["A","Peito & Tríceps","6 exercícios · ~54 min","done"],["B","Costas & Bíceps","6 exercícios · ~52 min","today"],["C","Pernas","7 exercícios · ~60 min",""],["D","Ombros & Core","5 exercícios · ~40 min",""]];
  return (
    <div className="scroll">
      <HeroHeader eyebrow="Fase 2 · Hipertrofia" title="Treino do dia" right={<RoundBtn icon="calendar" />} />
      <div style={{borderRadius:24,overflow:"hidden",position:"relative",marginTop:18,backgroundImage:`linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.85)), url(${IMG.back})`,backgroundSize:"cover",backgroundPosition:"center",padding:16,display:"flex",flexDirection:"column",justifyContent:"flex-end",height:218}}>
        <div style={{display:"flex",gap:6,marginBottom:9}}><Chip tone="primary">Sugerido para hoje</Chip><Chip>Treino B</Chip></div>
        <div style={{color:"#fff",fontSize:23,fontWeight:700,letterSpacing:"-.025em"}}>Costas &amp; Bíceps</div>
        <div style={{display:"flex",alignItems:"center",gap:14,marginTop:5}}>
          <span style={{color:"rgba(255,255,255,.85)",fontSize:12.5,display:"flex",alignItems:"center",gap:5}}>{I("dumbbell",13,"rgba(255,255,255,.85)")} 6 exercícios</span>
          <span style={{color:"rgba(255,255,255,.85)",fontSize:12.5,display:"flex",alignItems:"center",gap:5}}>{I("clock",13,"rgba(255,255,255,.85)")} ~52 min</span>
        </div>
        <div style={{marginTop:14,height:46,borderRadius:15,background:LIME,color:"#0d1a00",display:"flex",alignItems:"center",justifyContent:"center",gap:8,fontWeight:800,fontSize:13.5,letterSpacing:".08em",textTransform:"uppercase",boxShadow:`0 10px 26px -8px ${LIME}`}}>{I("play",17,"#0d1a00")} Começar treino</div>
      </div>
      <SectionTitle action="4 treinos">Treinos da fase</SectionTitle>
      {WK.map(([letter,name,meta,state])=>(
        <div key={letter} className="glass" style={{padding:13,display:"flex",alignItems:"center",gap:13,marginBottom:9,borderColor:state==="today"?LIME:"var(--glass-brd)",opacity:state==="done"?.6:1}}>
          <div style={{width:38,height:38,borderRadius:12,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"var(--font-display)",fontWeight:800,fontSize:16,background:state==="today"?LIME:"var(--glass-strong)",color:state==="today"?"#0d1a00":"var(--ios-label2)"}}>{letter}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14.5,fontWeight:600,color:"var(--ios-label)",letterSpacing:"-.01em"}}>{name}</div>
            <div style={{fontSize:12,color:"var(--ios-label2)",marginTop:1}}>{meta}</div>
          </div>
          {state==="done" ? I("circle-check",18,"#34D399") : I("chevron-right",17,"var(--ios-label3)")}
        </div>
      ))}
      <div style={{height:100}}></div>
    </div>
  );
}

/* ---------- 3. Detalhe do treino ---------- */
function DetailScreen(){
  const EX=[["Puxada Alta","4 × 8-10","60 kg",IMG.back],["Remada Curvada","4 × 8-10","45 kg",IMG.back],["Remada Unilateral","3 × 12","28 kg",IMG.arms],["Rosca Direta","4 × 10-12","25 kg",IMG.arms],["Rosca Martelo","3 × 12","18 kg",IMG.arms],["Rosca Concentrada","3 × 15","12 kg",IMG.chest]];
  return (
    <div className="scroll">
      <div style={{paddingTop:14,display:"flex",justifyContent:"space-between"}}><RoundBtn icon="chevron-left" /><RoundBtn icon="share" /></div>
      <div style={{paddingTop:58}}>
        <div style={{display:"flex",gap:6,marginBottom:10}}><Chip>Costas</Chip><Chip>Bíceps</Chip><Chip>Hipertrofia</Chip></div>
        <div style={{fontSize:30,fontWeight:700,color:"var(--on-hero)",letterSpacing:"-.03em",lineHeight:1.1}}>Costas &amp; Bíceps</div>
        <div style={{fontSize:13.5,color:"var(--on-hero-2)",marginTop:7,lineHeight:1.4}}>Foco em amplitude e volume de puxada. Cadência 2-0-2 nas costas.</div>
      </div>
      <SectionTitle action="6 movimentos planejados">Lista de exercícios</SectionTitle>
      {EX.map(([name,sets,load,img],i)=>(
        <div key={name} className="glass" style={{padding:11,display:"flex",alignItems:"center",gap:12,marginBottom:9}}>
          <div style={{width:52,height:44,borderRadius:11,flexShrink:0,backgroundImage:`url(${img})`,backgroundSize:"cover",backgroundPosition:"center"}}></div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14.5,fontWeight:600,color:"var(--ios-label)",letterSpacing:"-.01em"}}>{name}</div>
            <div style={{display:"flex",gap:10,marginTop:3}}>
              <span style={{fontSize:11.5,color:"var(--ios-label2)",display:"flex",alignItems:"center",gap:4}}>{I("repeat",12,"var(--ios-label3)")} {sets}</span>
              <span style={{fontSize:11.5,color:"var(--ios-label2)",display:"flex",alignItems:"center",gap:4}}>{I("dumbbell",12,"var(--ios-label3)")} {load}</span>
              <span style={{fontSize:11.5,color:"var(--ios-label2)",display:"flex",alignItems:"center",gap:4}}>{I("clock",12,"var(--ios-label3)")} 90 s</span>
            </div>
          </div>
          <span style={{fontSize:12,fontWeight:700,color:"var(--ios-label3)"}}>{String(i+1).padStart(2,"0")}</span>
        </div>
      ))}
      <div style={{height:130}}></div>
    </div>
  );
}

/* ---------- 4. Pré-início ---------- */
function PreStartScreen(){
  return (
    <div className="scroll" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",paddingBottom:120}}>
      <div className="glass" style={{width:124,height:124,borderRadius:40,display:"flex",alignItems:"center",justifyContent:"center",transform:"rotate(12deg)",borderColor:LIME,boxShadow:`0 0 44px -6px ${LIME}`}}>
        <div style={{transform:"rotate(-12deg)"}}>{I("dumbbell",56,LIME)}</div>
      </div>
      <div style={{fontFamily:"var(--font-display)",fontSize:36,fontWeight:800,color:"var(--on-hero)",letterSpacing:"-.03em",textTransform:"uppercase",lineHeight:1.05,marginTop:38}}>Costas<br/>&amp; Bíceps</div>
      <div style={{fontSize:15,color:"var(--on-hero-2)",marginTop:12,fontWeight:500}}>6 exercícios · 22 séries · ~52 min</div>
      <div style={{display:"flex",gap:7,marginTop:20}}><Chip>Treino B</Chip><Chip>Fase 2</Chip><Chip>Hipertrofia</Chip></div>
      <div style={{width:"100%",height:62,borderRadius:22,background:LIME,color:"#0d1a00",display:"flex",alignItems:"center",justifyContent:"center",gap:10,fontFamily:"var(--font-display)",fontWeight:800,fontSize:17,letterSpacing:".14em",textTransform:"uppercase",boxShadow:`0 14px 40px -10px ${LIME}`,marginTop:44}}>{I("play",22,"#0d1a00")} Iniciar treino</div>
      <div style={{fontSize:12.5,color:"var(--ios-label3)",marginTop:16}}>Último: 12 ago · volume 4,0 t</div>
    </div>

}

/* ---------- 5. Execução — registro de séries ---------- */
function ExecutionScreen(){
  const DONE=[["Puxada Alta",4,4,"60 kg"]];
  const NEXT=[["Remada Unilateral","3 × 12","28 kg"],["Rosca Direta","4 × 10-12","25 kg"],["Rosca Martelo","3 × 12","18 kg"]];
  return (
    <div className="scroll">
      <div style={{paddingTop:14,display:"flex",alignItems:"center",gap:12}}>
        <RoundBtn icon="x" />
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:16,fontWeight:700,color:"var(--on-hero)",letterSpacing:"-.02em"}}>Costas &amp; Bíceps</div>
          <div style={{fontSize:12,color:"var(--on-hero-2)",display:"flex",alignItems:"center",gap:5,marginTop:2}}>{I("clock",12,"var(--on-hero-2)")} 18:24 em execução</div>
        </div>
        <RoundBtn icon="volume-2" /><RoundBtn icon="mic" />
      </div>
      <div style={{marginTop:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
          <span style={{fontSize:12,fontWeight:700,color:"hsl(var(--primary-text))"}}>Exercício 2 de 6</span>
          <span style={{fontSize:12,fontWeight:700,color:"var(--on-hero-2)"}}>8 de 22 séries</span>
        </div>
        <div style={{marginTop:8}}><Bar pct={36} h={3} /></div>
      </div>

      {DONE.map(([name,c,t,load])=>(
        <div key={name} className="glass" style={{padding:13,marginTop:14,opacity:.6,display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:34,height:34,borderRadius:99,background:"#34D399",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{I("check",18,"#06281a")}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14.5,fontWeight:600,color:"var(--ios-label)",textDecoration:"line-through"}}>{name}</div>
            <div style={{fontSize:12,color:"var(--ios-label2)",marginTop:1}}>{c}/{t} séries · {load}</div>
          </div>
        </div>
      ))}

      <div className="glass" style={{marginTop:12,padding:0,overflow:"hidden",borderColor:"color-mix(in srgb, hsl(var(--primary)) 55%, transparent)",boxShadow:`inset 0 1px 0 var(--spec), 0 18px 44px -18px ${LIME}, 0 4px 12px -4px rgba(0,0,0,.4)`}}>
        <div style={{position:"relative",padding:"14px 15px 15px",background:"color-mix(in srgb, hsl(var(--primary)) 9%, transparent)"}}>
          <div style={{position:"absolute",left:0,top:0,bottom:0,width:3,background:LIME}}></div>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:52,height:52,borderRadius:15,flexShrink:0,backgroundImage:`url(${IMG.back})`,backgroundSize:"cover",backgroundPosition:"center",border:`1.5px solid color-mix(in srgb, hsl(var(--primary)) 60%, transparent)`}}></div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{width:6,height:6,borderRadius:99,background:LIME,boxShadow:`0 0 0 3px color-mix(in srgb, hsl(var(--primary)) 25%, transparent)`}}></span>
                <span style={{fontSize:10,fontWeight:800,letterSpacing:".14em",textTransform:"uppercase",color:"hsl(var(--primary-text))"}}>Em execução</span>
              </div>

/* ---------- 6. Descanso ---------- */
function RestRing({ left=45, total=90, size=178 }){
  const stroke=5, r=(size-stroke)/2-6, c=2*Math.PI*r, pct=left/total;
  const ang=(-90+360*pct)*Math.PI/180, dx=size/2+r*Math.cos(ang), dy=size/2+r*Math.sin(ang);
  const mm=String(Math.floor(left/60)).padStart(2,"0"), ss=String(left%60).padStart(2,"0");
  return (
    <div style={{position:"relative",width:size,height:size}}>
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--glass-strong)" strokeWidth={stroke} strokeDasharray="2 9" strokeLinecap="round" />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={LIME} strokeWidth={stroke} strokeDasharray={`${c*pct} ${c}`} strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`} style={{filter:`drop-shadow(0 0 10px ${LIME})`}} />
        <circle cx={dx} cy={dy} r={6} fill={LIME} style={{filter:`drop-shadow(0 0 12px ${LIME})`}} />
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:".22em",textTransform:"uppercase",color:"var(--on-hero-2)"}}>Descanso</div>
        <div style={{fontFamily:"var(--font-display)",fontSize:48,fontWeight:800,color:"var(--on-hero)",lineHeight:1.05,letterSpacing:"-.03em",display:"flex",alignItems:"baseline",gap:2,marginTop:4}}>
          <span>{mm}</span><span style={{color:LIME}}>:</span><span>{ss}</span>
        </div>
        <div style={{fontSize:12.5,color:"var(--on-hero-2)",marginTop:4}}>Intervalo de {total} s</div>
      </div>
    </div>
  );
}
