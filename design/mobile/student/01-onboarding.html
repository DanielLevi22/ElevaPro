<!-- @dsCard group="Mobile · Student" viewport="2600x7500" name="01 · Onboarding (Praticante)" subtitle="Boas-vindas → objetivo → nível → sobre você → saúde/triagem → treino → alimentação → plano → Hoje · escuro e claro" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Onboarding do praticante</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../kit/glass.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
<style>
.th{--ios-bg:#07080A;--ios-label:#fff;--ios-label2:rgba(235,235,245,0.66);--ios-label3:rgba(235,235,245,0.34);--glass:rgba(255,255,255,0.07);--glass-strong:rgba(255,255,255,0.11);--glass-brd:rgba(255,255,255,0.13);--glass-top:rgba(255,255,255,0.13);--glass-bot:rgba(255,255,255,0.035);--spec:rgba(255,255,255,0.22);--spec-bot:rgba(0,0,0,0.18);--tab-bg:rgba(18,19,22,0.72);--scrim:rgba(0,0,0,.55);--sheet:rgba(18,19,22,0.94);--field:rgba(255,255,255,0.06);--field-brd:rgba(255,255,255,0.12)}
.th.light{--ios-bg:#EFEFF4;--ios-label:#0B0B0F;--ios-label2:rgba(60,60,67,0.8);--ios-label3:rgba(60,60,67,0.45);--glass:rgba(255,255,255,0.86);--glass-strong:rgba(118,118,128,0.16);--glass-brd:rgba(60,60,67,0.14);--glass-top:rgba(255,255,255,0.98);--glass-bot:rgba(255,255,255,0.78);--spec:rgba(255,255,255,1);--spec-bot:rgba(0,0,0,0.04);--tab-bg:rgba(255,255,255,0.9);--scrim:rgba(239,239,244,.62);--sheet:rgba(255,255,255,0.96);--field:rgba(118,118,128,0.1);--field-brd:rgba(60,60,67,0.14)}
body{margin:0;padding:40px;background:hsl(var(--background));color:hsl(var(--foreground));font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:hsl(var(--primary))}a:hover{color:hsl(var(--primary-text))}
.phone{width:390px;height:820px;border-radius:52px;background:var(--ios-bg);color:var(--ios-label);font-family:var(--font-sans);border:11px solid #000;box-shadow:0 40px 80px -20px rgba(0,0,0,.55);overflow:hidden;position:relative;display:flex;flex-direction:column}
.phone::after{content:"";position:absolute;left:-15%;right:-15%;top:120px;height:340px;pointer-events:none;z-index:1;background:radial-gradient(50% 50% at 50% 50%,hsl(var(--primary) / .14) 0%,transparent 70%);filter:blur(40px)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:9}
.statusbar{height:52px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;position:relative;z-index:5;color:var(--ios-label)}
.scroll{flex:1;overflow:hidden;padding:0 18px 150px;position:relative;z-index:2}
.tabitem{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--ios-label3)}
.homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--ios-label);opacity:.4;z-index:9}
svg.lucide{stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div id="root"></div>
<script type="text/babel" src="../kit/kit.jsx"></script>
<script type="text/babel" src="01-onboarding/onb-screens-a.jsx"></script>
<script type="text/babel" src="01-onboarding/onb-screens-b.jsx"></script>
<script type="text/babel" src="01-onboarding/aluno-convite.jsx"></script>
<script type="text/babel">
const sub={fontFamily:"var(--font-mono)",fontSize:10,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",color:"hsl(var(--muted-foreground))"};
function Pair({id,label,S,state}){
  return <div data-screen-label={id} style={{display:"flex",flexDirection:"column",gap:12}}>
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <span style={{padding:"4px 9px",borderRadius:99,background:"hsl(var(--primary))",color:"hsl(var(--primary-foreground))",fontFamily:"var(--font-mono)",fontSize:11,fontWeight:700}}>{id}</span>
      <span style={{fontFamily:"var(--font-display)",fontWeight:800,fontSize:18,letterSpacing:"-.02em"}}>{label}</span>
      {state&&<span style={{...sub,padding:"3px 8px",borderRadius:99,border:"1px solid hsl(var(--border))"}}>Estado · {state}</span>}
    </div>
    <div style={{display:"flex",gap:14}}>
      {["","light"].map(t=><div key={t} className={"th "+t} style={{display:"flex",flexDirection:"column",gap:8}}><span style={sub}>{t?"Claro":"Escuro"}</span><S/></div>)}
    </div>
  </div>;
}
function Arrow({label,down}){
  return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,width:96,alignSelf:"center",textAlign:"center"}}>
    <div style={{width:44,height:44,borderRadius:99,border:"1px solid hsl(var(--border))",display:"flex",alignItems:"center",justifyContent:"center"}}>{I(down?"corner-down-right":"arrow-right",20,"hsl(var(--primary))")}</div>
    {label&&<span style={{...sub,fontSize:9,lineHeight:1.4,letterSpacing:".1em"}}>{label}</span>}
  </div>;
}
function Section({title,children}){
  return <div style={{marginBottom:64}}><div style={{...sub,fontSize:13,color:"hsl(var(--foreground))",marginBottom:20}}>{title}</div><div style={{display:"flex",alignItems:"flex-start"}}>{children}</div></div>;
}
function App(){
  React.useEffect(()=>{window.lucide?.createIcons();});
  return <div>
    <div style={{fontFamily:"var(--font-display)",fontWeight:800,fontSize:40,letterSpacing:"-.03em",marginBottom:6}}>Onboarding do praticante</div>
    <div style={{fontSize:15,color:"hsl(var(--muted-foreground))",marginBottom:44}}>Do cadastro ao primeiro plano aprovado em menos de 5 minutos. Cada tela em escuro e claro.</div>
    <Section title="A · Entrada"><Pair id="O1" label="Boas-vindas" S={O1}/><Arrow/><Pair id="O2" label="Objetivo" S={O2}/><Arrow/><Pair id="O3" label="Nível" S={O3}/></Section>
    <Section title="B · Sobre você e triagem"><Pair id="O4" label="Sobre você" S={O4}/><Arrow/><Pair id="O5" label="Sua saúde" S={O5}/><Arrow down label="Marcou condição clínica (ou prefiro não informar, ver Estados)"/><Pair id="O5b" label="Triagem · encaminhamento" S={O5b}/></Section>
    <Section title="C · Rotina e geração"><Arrow label="De O5 sem condição, ou de O5b só treino"/><Pair id="O6" label="Seu treino" S={O6}/><Arrow/><Pair id="O7" label="Sua alimentação" S={O7}/><Arrow/><Pair id="O8" label="Montando seu plano" S={O8}/></Section>
    <Section title="D · Plano e primeira visita"><Pair id="O9" label="Seu plano está pronto" S={O9}/><Arrow label="Ajustar"/><Pair id="O10" label="Ajustar · folha" S={O10}/><Arrow label="Aprovar plano"/></Section>
    <Section title="E · Depois de aprovar"><Pair id="O11" label="Conectar o relógio" S={O11}/><Arrow label="Conectar ou agora não"/><Pair id="O12" label="Hoje · primeira visita" S={O12}/></Section>
    <Section title="Estados"><Pair id="O2" label="Objetivo" state="sem escolha" S={O2Vazio}/><div style={{width:60}}></div><Pair id="O4" label="Sobre você" state="campo inválido" S={O4Erro}/><div style={{width:60}}></div><Pair id="O8" label="Montando" state="falha de rede" S={O8Erro}/></Section>
    <Section title="Estados · triagem"><Pair id="O5b" label="Triagem" state="prefiro não informar" S={O5bSemInfo}/></Section>
    <Section title="Variante · Aluno · entrada por convite (não passa pelo onboarding nem gera plano)"><Pair id="AL1" label="Definir senha · Variante · Aluno" S={AlunoSenha}/><Arrow/><Pair id="AL2" label="Vínculo com o especialista · Variante · Aluno" S={AlunoVinculo}/><Arrow/><Pair id="AL3" label="Anamnese por etapas · Variante · Aluno" S={AlunoAnamnese}/></Section>
    <Section title="Componentes novos · derivados do kit"><div style={{display:"flex",gap:24}}>{["","light"].map(t=><div key={t} className={"th "+t} style={{display:"flex",flexDirection:"column",gap:8}}><span style={sub}>{t?"Claro":"Escuro"}</span><Board/></div>)}</div></Section>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
setTimeout(()=>window.lucide?.createIcons(),80);
</script></body></html>
