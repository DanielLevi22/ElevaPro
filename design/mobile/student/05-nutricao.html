<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../kit/glass.css">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
:root{
--on-hero:#fff;--on-hero-2:rgba(255,255,255,.82);--hero-chip:rgba(255,255,255,.16);--hero-chip-brd:rgba(255,255,255,.28);
--slot:rgba(255,255,255,.05);--slot-line:rgba(255,255,255,.07);
--mp:#34D399;--mc:#A3E635;--mf:#FBBF24;--mp-t:#34D399;--mc-t:#A3E635;--mf-t:#FBBF24;
}
.light{
--on-hero:#0B0B0F;--on-hero-2:rgba(28,28,32,.82);--hero-chip:rgba(255,255,255,.72);--hero-chip-brd:rgba(60,60,67,.16);
--slot:rgba(60,60,67,.05);--slot-line:rgba(60,60,67,.09);
--mp-t:#0B7A52;--mc-t:#4E7A0B;--mf-t:#8A5E03;
}
.glow{position:absolute;left:-15%;right:-15%;top:-60px;height:420px;pointer-events:none;z-index:0;background:radial-gradient(50% 50% at 50% 50%,hsl(var(--primary) / .18) 0%,transparent 70%);filter:blur(30px)}

.scroll{flex:1;overflow:auto;padding:0 18px 12px;scrollbar-width:none;position:relative;z-index:2}
.slot{background-color:var(--slot);background-image:repeating-linear-gradient(135deg,var(--slot-line) 0 1px,transparent 1px 9px);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px}
.slot span{font-family:var(--font-mono),ui-monospace,monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ios-label3);line-height:1.4}
.footerbar{position:absolute;left:0;right:0;bottom:118px;z-index:6;padding:0 18px;display:flex;gap:9px;pointer-events:none}
.btn{height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}

.btn.ghost{background:var(--glass-strong);color:var(--ios-label);border:1px solid var(--glass-brd)}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="../kit/kit.jsx"></script>
<script type="text/babel" data-presets="react">
const I=(n,s=20,c)=><i data-lucide={n} style={{width:s,height:s,display:"block",color:c,flexShrink:0}}></i>;
const LIME="hsl(var(--primary))";
const P="var(--mp)", C="var(--mc)", F="var(--mf)";
const PT="var(--mp-t)", CT="var(--mc-t)", FT="var(--mf-t)";

function StatusBar(){
  return <div className="statusbar"><span>9:41</span><span style={{display:"flex",alignItems:"center",gap:6}}>{I("signal",16,"var(--on-hero)")}{I("wifi",16,"var(--on-hero)")}{I("battery-full",20,"var(--on-hero)")}</span></div>;
}
function RoundBtn({ icon, size=38 }){
  return <div className="glass" style={{width:size,height:size,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,background:"var(--hero-chip)",borderColor:"var(--hero-chip-brd)"}}>{I(icon,size*0.47,"var(--on-hero)")}</div>;
}
function Slot({ label, h=150, r=20, style }){
  return <div className="slot" style={{height:h,borderRadius:r,...style}}><span>{label}</span></div>;
}
function SectionTitle({ children, action }){
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",margin:"20px 2px 10px"}}>
      <span style={{fontSize:10.5,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",color:"var(--ios-label3)"}}>{children}</span>
      {action && <span style={{fontSize:11.5,fontWeight:600,color:"hsl(var(--primary-text))"}}>{action}</span>}
    </div>
  );
}
function Chip({ children, tone }){
  const on = tone==="primary";
  return <span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 10px",borderRadius:99,fontSize:10.5,fontWeight:800,textTransform:"uppercase",letterSpacing:".06em",background:on?LIME:"var(--glass-strong)",color:on?"#0d1a00":"var(--ios-label2)"}}>{children}</span>;
}
function Bar({ pct, color=LIME, h=6 }){
  return <div style={{height:h,borderRadius:99,background:"var(--glass-strong)",overflow:"hidden"}}><div style={{width:`${Math.min(100,pct)}%`,height:"100%",background:color,borderRadius:99}} /></div>;
}
function Ring({ pct, color=LIME, size=150, stroke=12, children }){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return (
    <div style={{position:"relative",width:size,height:size}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)",filter:`drop-shadow(0 0 12px ${color})`}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--glass-strong)" strokeWidth={stroke} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={`${c*Math.min(1,pct/100)} ${c}`} />
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>{children}</div>
    </div>
  );
}
function MacroDonut({ label, value, unit, pct, color, tcolor }){
  return (
    <div className="glass" style={{flex:1,padding:"12px 6px",display:"flex",flexDirection:"column",alignItems:"center",gap:7}}>
      <Ring pct={pct} color={color} size={62} stroke={6}>
        <span style={{fontFamily:"var(--font-display)",fontSize:14,fontWeight:800,color:"var(--ios-label)",letterSpacing:"-.02em"}}>{value}<span style={{fontSize:9,fontWeight:700}}>{unit}</span></span>
      </Ring>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:11.5,fontWeight:700,color:"var(--ios-label)"}}>{label}</div>
        <div style={{fontSize:10.5,fontWeight:700,color:tcolor||color}}>{pct}%</div>
      </div>
    </div>
  );
}

/* ---------- 1. Plano do dia ---------- */
function PlanScreen(){
  const DAYS=[["S",8],["T",9],["Q",10],["Q",11],["S",12],["S",13],["D",14]];
  const MEALS=[
    ["Café da Manhã","07:10","Ovos, aveia, banana",520,true],
    ["Lanche da Manhã","10:00","Whey + castanhas",280,true],
    ["Almoço","12:40","Frango, arroz, salada",740,false],
    ["Lanche da Tarde","16:00","Iogurte + granola",240,false],
    ["Jantar","19:30","Salmão, batata doce",620,false],
  ];
  return (
    <div className="scroll">
      <div style={{paddingTop:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontSize:12.5,color:"var(--on-hero-2)",fontWeight:600}}>Plano: Cutting · Fase 2</div>
          <div style={{fontSize:27,fontWeight:700,color:"var(--on-hero)",letterSpacing:"-.03em",marginTop:2}}>Nutrição</div>
        </div>
        <div style={{display:"flex",gap:9}}><RoundBtn icon="calendar" /><RoundBtn icon="plus" /></div>
      </div>
      <div style={{display:"flex",gap:6,marginTop:16}}>
        {DAYS.map(([d,n],i)=>(
          <div key={n} className={i===4?"":"glass"} style={{flex:1,padding:"9px 0",borderRadius:14,display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:i===4?LIME:undefined,boxShadow:i===4?`0 8px 22px -8px ${LIME}`:undefined}}>
            <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:i===4?"#0d1a00":"var(--ios-label3)"}}>{d}</span>
            <span style={{fontSize:14,fontWeight:800,fontFamily:"var(--font-display)",color:i===4?"#0d1a00":"var(--ios-label)"}}>{n}</span>
          </div>
        ))}
      </div>
      <div style={{display:"flex",justifyContent:"center",margin:"20px 0 6px"}}>
        <Ring pct={64} color={P} size={162} stroke={13}>
          <span style={{fontFamily:"var(--font-display)",fontSize:38,fontWeight:800,color:"var(--on-hero)",letterSpacing:"-.03em",lineHeight:1}}>1540</span>
          <span style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".12em",color:"var(--on-hero-2)",marginTop:6}}>de 2400 kcal</span>
        </Ring>
      </div>
      <div style={{display:"flex",gap:9,marginTop:10}}>
        <MacroDonut label="Proteína" value="148" unit="g" pct={82} color={P} tcolor={PT} />
        <MacroDonut label="Carbos" value="162" unit="g" pct={68} color={C} tcolor={CT} />
        <MacroDonut label="Gordura" value="47" unit="g" pct={67} color={F} tcolor={FT} />
      </div>
      <SectionTitle action="Editar">Refeições de hoje</SectionTitle>
      {MEALS.map(([name,time,desc,kcal,done])=>(
        <div key={name} className="glass" style={{padding:11,display:"flex",alignItems:"center",gap:12,marginBottom:9}}>
          <Slot label={"foto"} h={46} r={13} style={{width:52,flexShrink:0}} />
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"baseline",gap:7}}>
              <span style={{fontSize:14.5,fontWeight:600,color:"var(--ios-label)",letterSpacing:"-.01em"}}>{name}</span>
              <span style={{fontSize:11,color:"var(--ios-label3)"}}>{time}</span>
            </div>
            <div style={{fontSize:12,color:"var(--ios-label2)",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{desc}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5}}>
            <span style={{fontSize:12.5,fontWeight:700,color:"var(--ios-label)"}}>{kcal}</span>
            <div style={{width:24,height:24,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",background:done?P:"transparent",border:done?"none":"1.5px solid var(--ios-label3)"}}>{done && I("check",14,"#06281a")}</div>
          </div>
        </div>
      ))}
      <div style={{height:110}}></div>
    </div>
  );
}

/* ---------- 2. Detalhe da refeição ---------- */

/* ---------- 3. Buscar alimento ---------- */
function SearchScreen(){
  const CATS=[["leaf","Vegano"],["beef","Proteína"],["wheat","Low carb"],["cookie","Snacks"],["cup-soda","Bebidas"]];
  const PICKS=[["Salada de frango","320 kcal · 20 min","Alta proteína"],["Bowl de abacate","280 kcal · 15 min","Low carb"]];
  const RESULTS=[["Peito de frango","100 g · 165 kcal","31 g prot"],["Arroz integral","100 g · 124 kcal","2,6 g prot"],["Ovo cozido","1 un · 78 kcal","6,3 g prot"],["Batata doce","100 g · 86 kcal","1,6 g prot"]];
  return (
    <div className="scroll">
      <div style={{paddingTop:6,display:"flex",alignItems:"center",gap:11}}>
        <div style={{width:40,height:40,borderRadius:99,flexShrink:0,background:"var(--glass-strong)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,color:"var(--on-hero)",fontSize:15}}>J</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:15,fontWeight:700,color:"var(--on-hero)",letterSpacing:"-.01em"}}>Olá, João</div>

        </div>

      </div>
      <div style={{fontSize:27,fontWeight:700,color:"var(--on-hero)",letterSpacing:"-.03em",lineHeight:1.15,marginTop:18}}>O que você vai<br/>comer <span style={{color:"hsl(var(--primary-text))"}}>agora?</span></div>
      <div style={{display:"flex",gap:10,marginTop:16}}>
        <div className="glass" style={{flex:1,height:48,borderRadius:16,display:"flex",alignItems:"center",gap:9,padding:"0 14px"}}>
          {I("search",17,"var(--ios-label3)")}<span style={{fontSize:13.5,color:"var(--ios-label3)"}}>Buscar alimento ou receita…</span>
        </div>
        <div style={{width:48,height:48,borderRadius:16,background:LIME,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow:`0 10px 24px -10px ${LIME}`}}>{I("sliders-horizontal",19,"#0d1a00")}</div>
      </div>
      <SectionTitle action="Ver tudo">Categorias</SectionTitle>
      <div style={{display:"flex",gap:8}}>
        {CATS.map(([icon,label],i)=>(
          <div key={label} className="glass" style={{flex:1,padding:"11px 3px",display:"flex",flexDirection:"column",alignItems:"center",gap:7,borderColor:i===1?LIME:"var(--glass-brd)"}}>
            {I(icon,19,i===1?LIME:"var(--ios-label2)")}
            <span style={{fontSize:9.5,fontWeight:700,color:i===1?"hsl(var(--primary-text))":"var(--ios-label2)",textAlign:"center"}}>{label}</span>

      </div>

        {PICKS.map(([name,meta,tag])=>(
          <div key={name} className="glass" style={{flex:1,padding:9}}>
            <div style={{position:"relative"}}>
              <Slot label={"foto"} h={104} r={15} />
              <span style={{position:"absolute",left:8,bottom:8,background:LIME,color:"#0d1a00",fontSize:9,fontWeight:800,padding:"3px 8px",borderRadius:99,textTransform:"uppercase",letterSpacing:".05em"}}>{tag}</span>
            </div>
            <div style={{fontSize:13.5,fontWeight:700,color:"var(--ios-label)",marginTop:10,letterSpacing:"-.01em"}}>{name}</div>
            <div style={{fontSize:11.5,color:"var(--ios-label2)",marginTop:2}}>{meta}</div>
          </div>
        ))}
      </div>
      <SectionTitle action="4 resultados">Resultados</SectionTitle>
      {RESULTS.map(([name,meta,prot])=>(
        <div key={name} className="glass" style={{padding:12,display:"flex",alignItems:"center",gap:12,marginBottom:9}}>
          <div style={{width:34,height:34,borderRadius:11,background:"var(--glass-strong)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{I("apple",16,PT)}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14,fontWeight:600,color:"var(--ios-label)"}}>{name}</div>
            <div style={{fontSize:11.5,color:"var(--ios-label2)",marginTop:1}}>{meta} · {prot}</div>
          </div>
          <div style={{width:28,height:28,borderRadius:99,background:LIME,display:"flex",alignItems:"center",justifyContent:"center"}}>{I("plus",16,"#0d1a00")}</div>
        </div>
      ))}
      <div style={{height:110}}></div>
    </div>
  );
}

/* ---------- 4. Substituir alimento ---------- */

/* ---------- 5. Escanear com IA ---------- */
function ScanScreen(){
  return (
