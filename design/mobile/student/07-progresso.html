<style>

--slot:rgba(255,255,255,.05);--slot-line:rgba(255,255,255,.07);
--track:rgba(255,255,255,.09);--grid:rgba(255,255,255,.07);
--c1:#34D399;--c1t:#34D399;--c2:#38BDF8;--c2t:#38BDF8;--c3:#C084FC;--c3t:#C084FC;--c4:#FBBF24;--c4t:#FBBF24;--c5:#F87171;--c5t:#F87171;
}
.light{

--on-hero:#0B0B0F;--on-hero-2:rgba(28,28,32,.82);--hero-chip:rgba(255,255,255,.72);--hero-chip-brd:rgba(60,60,67,.16);
--slot:rgba(60,60,67,.05);--slot-line:rgba(60,60,67,.09);

--c1t:#0B7A52;--c2t:#0369A1;--c3t:#7E22CE;--c4t:#8A5E03;--c5t:#B91C1C;
}

<div id="root"></div>
<script type="text/babel" data-presets="react" src="../kit/hero-objects.js"></script>
<script type="text/babel" src="../kit/kit.jsx"></script>
<script type="text/babel" data-presets="react">
const I=(n,s=20,c)=><i data-lucide={n} style={{width:s,height:s,display:"block",color:c,flexShrink:0}}></i>;
const LIME="hsl(var(--primary))", LIMET="hsl(var(--primary-text))";
const C=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];
const CT=["var(--c1-t,var(--c1t))","var(--c2t)","var(--c3t)","var(--c4t)","var(--c5t)"];
const G="var(--c1)", GT="var(--c1t)", B="var(--c2)", BT="var(--c2t)", P="var(--c3)", PT="var(--c3t)", A="var(--c4)", AT="var(--c4t)", R="var(--c5)", RT="var(--c5t)";

function StatusBar(){
  return <div className="statusbar"><span>9:41</span><span style={{display:"flex",alignItems:"center",gap:6}}>{I("signal",16,"var(--on-hero)")}{I("wifi",16,"var(--on-hero)")}{I("battery-full",20,"var(--on-hero)")}</span></div>;
}
function RoundBtn({ icon, size=38 }){
  return <div className="glass" style={{width:size,height:size,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,background:"var(--hero-chip)",borderColor:"var(--hero-chip-brd)"}}>{I(icon,size*0.47,"var(--on-hero)")}</div>;
}
function SectionTitle({ children, action }){
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",margin:"20px 2px 10px"}}>
      <span style={{fontSize:10.5,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",color:"var(--ios-label3)"}}>{children}</span>
      {action && <span style={{fontSize:11.5,fontWeight:600,color:LIMET}}>{action}</span>}
    </div>
  );
}
function Chip({ children, tone }){
  const on=tone==="primary";
  return <span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 10px",borderRadius:99,fontSize:10.5,fontWeight:800,textTransform:"uppercase",letterSpacing:".06em",background:on?LIME:"var(--glass-strong)",color:on?"#0d1a00":"var(--ios-label2)"}}>{children}</span>;
}
function Segmented({ items, active=0 }){
  return (
    <div className="glass" style={{display:"flex",padding:4,borderRadius:16,gap:4}}>
      {items.map((t,i)=>(
        <div key={t} style={{flex:1,height:34,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11.5,fontWeight:700,background:i===active?LIME:"transparent",color:i===active?"#0d1a00":"var(--ios-label2)"}}>{t}</div>
      ))}
    </div>
  );
}
function CardTitle({ children, note }){
  return (
    <div style={{marginBottom:12}}>
      <div style={{fontSize:11,fontWeight:800,letterSpacing:".12em",textTransform:"uppercase",color:"var(--ios-label2)"}}>{children}</div>
      {note && <div style={{fontSize:11.5,color:"var(--ios-label3)",marginTop:3}}>{note}</div>}
    </div>
  );
}

/* ---- Gráficos ---- */
let UID=0; const uid=p=>`${p}${++UID}`;

/** Curva monotônica: suave sem inventar picos que os dados não têm. */
function smoothPath(pts){
  if(pts.length<2) return "";
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`;
  }
  return d;
}

/** Linha/área com gradiente, faixa de meta, extremos anotados e último valor em destaque. */
function AreaChart({ series, labels, height=150, goal=null, goalLabel="meta", unit="", format=v=>v, band=null }){
  const w=304, pad=10, bottom=20, top=16;
  const all=series.flatMap(s=>s.data).concat(goal!=null?[goal]:[]);
  const lo=Math.min(...all), hi=Math.max(...all), span=(hi-lo)||1;
  const min=lo-span*0.16, max=hi+span*0.16, range=max-min;
  const n=series[0].data.length;
  const X=i=>pad+(i*(w-pad*2))/(n-1);
  const Y=v=>top+(1-(v-min)/range)*(height-top-bottom);
  const gid=series.map(()=>uid("g"));
  const last=series[0].data[n-1], lastY=Y(last), lastX=X(n-1);
  const iMax=series[0].data.indexOf(Math.max(...series[0].data));
  const iMin=series[0].data.indexOf(Math.min(...series[0].data));
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${height}`} style={{width:"100%",height,display:"block",overflow:"visible"}}>
        <defs>
          {series.map((s,i)=>(
            <linearGradient key={i} id={gid[i]} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={s.color} stopOpacity="0.34" />
              <stop offset="70%" stopColor={s.color} stopOpacity="0.06" />
              <stop offset="100%" stopColor={s.color} stopOpacity="0" />
            </linearGradient>
          ))}
        </defs>
        {[0,0.33,0.66,1].map(t=>(
          <line key={t} x1="0" x2={w} y1={top+t*(height-top-bottom)} y2={top+t*(height-top-bottom)} stroke="var(--grid)" strokeWidth="1" />
        ))}
        {band && <rect x="0" y={Y(band[1])} width={w} height={Math.max(2,Y(band[0])-Y(band[1]))} fill={LIME} opacity=".07" />}
        {goal!=null && (
          <g>
            <line x1="0" x2={w} y1={Y(goal)} y2={Y(goal)} stroke="var(--ios-label3)" strokeWidth="1.5" strokeDasharray="5 5" />
            <text x={w} y={Y(goal)-6} fill="var(--ios-label3)" fontSize="9" fontWeight="700" textAnchor="end">{goalLabel} {format(goal)}</text>
          </g>
        )}
        {series.map((s,i)=>{
          const pts=s.data.map((v,j)=>[X(j),Y(v)]);
          const path=smoothPath(pts);
          return (
            <g key={i}>
              {i===0 && <path d={`${path} L${X(n-1)},${height-bottom} L${X(0)},${height-bottom} Z`} fill={`url(#${gid[i]})`} />}
              <path d={path} fill="none" stroke={s.color} strokeWidth={i===0?2.6:2} strokeDasharray={s.dashed?"5 5":undefined} strokeLinecap="round" style={{filter:`drop-shadow(0 2px 8px color-mix(in srgb, ${s.color} 55%, transparent))`}} />
            </g>
          );
        })}
        {[iMax,iMin].filter(i=>i!==n-1).map(i=>(
          <g key={i}>
            <circle cx={X(i)} cy={Y(series[0].data[i])} r="3" fill="var(--ios-bg)" stroke={series[0].color} strokeWidth="1.6" />
            <text x={X(i)} y={Y(series[0].data[i])-9} fill="var(--ios-label3)" fontSize="8.5" fontWeight="700" textAnchor="middle">{format(series[0].data[i])}</text>
          </g>
        ))}
        <line x1={lastX} x2={lastX} y1={lastY} y2={height-bottom} stroke={series[0].color} strokeWidth="1" opacity=".35" strokeDasharray="3 3" />
        <circle cx={lastX} cy={lastY} r="9" fill={series[0].color} opacity=".18" />
        <circle cx={lastX} cy={lastY} r="4.5" fill={series[0].color} stroke="var(--ios-bg)" strokeWidth="2" />
        <g transform={`translate(${Math.min(lastX, w-46)}, ${Math.max(top-4, lastY-22)})`}>
          <rect x="-26" y="-11" width="52" height="19" rx="9.5" fill={series[0].color} />
          <text x="0" y="3" fill="#0d1a00" fontSize="10.5" fontWeight="800" textAnchor="middle">{format(last)}{unit}</text>
        </g>
      </svg>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:2}}>
        {labels.map(l=><span key={l} style={{fontSize:9.5,fontWeight:600,color:"var(--ios-label3)"}}>{l}</span>)}
      </div>
    </div>
  );
}
const LineChart=AreaChart;

/** Colunas com gradiente, média do período e meta. */
function ColumnChart({ data, color=LIME, tcolor=LIMET, height=150, format=v=>v, goal=null }){
  const w=304, pad=4, bottom=20, top=16;
  const vals=data.map(d=>d[1]);
  const max=Math.max(...vals, goal||0)*1.12;
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const bw=(w-pad*2)/data.length, gap=bw*0.3;
  const Y=v=>top+(1-v/max)*(height-top-bottom);
  const gid=uid("c");
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${height}`} style={{width:"100%",height,display:"block",overflow:"visible"}}>
        <defs>
          <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="1" />
            <stop offset="100%" stopColor={color} stopOpacity="0.28" />
          </linearGradient>
        </defs>
        {[0,0.5,1].map(t=><line key={t} x1="0" x2={w} y1={top+t*(height-top-bottom)} y2={top+t*(height-top-bottom)} stroke="var(--grid)" strokeWidth="1" />)}
        {data.map(([l,v],i)=>{
          const x=pad+i*bw+gap/2, bwi=bw-gap, y=Y(v), last=i===data.length-1;
          return (
            <g key={l}>
              <rect x={x} y={top} width={bwi} height={height-top-bottom} rx="6" fill="var(--track)" opacity=".5" />
              <rect x={x} y={y} width={bwi} height={height-bottom-y} rx="6" fill={last?`url(#${gid})`:color} opacity={last?1:.45} />
              {last && <rect x={x} y={y} width={bwi} height="3" rx="1.5" fill="#fff" opacity=".5" />}
              <text x={x+bwi/2} y={y-6} fill={last?tcolor:"var(--ios-label3)"} fontSize="9" fontWeight="800" textAnchor="middle">{format(v)}</text>
              <text x={x+bwi/2} y={height-6} fill="var(--ios-label3)" fontSize="9.5" fontWeight="700" textAnchor="middle">{l}</text>
            </g>
          );
        })}
        <line x1="0" x2={w} y1={Y(avg)} y2={Y(avg)} stroke="var(--ios-label3)" strokeWidth="1.4" strokeDasharray="5 4" />
        <text x="2" y={Y(avg)-5} fill="var(--ios-label3)" fontSize="8.5" fontWeight="700">média {format(Math.round(avg))}</text>
        {goal!=null && <line x1="0" x2={w} y1={Y(goal)} y2={Y(goal)} stroke={LIME} strokeWidth="1.4" strokeDasharray="4 4" opacity=".8" />}
      </svg>
    </div>
  );
}
const BarChart=ColumnChart;

/** Barras horizontais com o período anterior como sombra, para ler a variação. */
function HBars({ data }){
  const max=Math.max(...data.map(d=>d[1]));
  return (
    <div style={{display:"flex",flexDirection:"column",gap:11}}>
      {data.map(([l,v,c,t,prev])=>{
        const dv=prev!=null?+(v-prev).toFixed(1):null;
        return (
          <div key={l}>
            <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:5}}>
              <span style={{fontSize:12,color:"var(--ios-label2)"}}>{l}</span>
              <span style={{display:"flex",alignItems:"baseline",gap:7}}>
                {dv!=null && <span style={{fontSize:10.5,fontWeight:700,color:dv>=0?GT:RT}}>{dv>=0?"+":"−"}{Math.abs(dv).toString().replace(".",",")}</span>}
                <span style={{fontSize:12.5,fontWeight:800,color:t}}>{v.toString().replace(".",",")} t</span>
              </span>
            </div>
            <div style={{position:"relative",height:11,borderRadius:99,background:"var(--track)",overflow:"hidden"}}>
              {prev!=null && <div style={{position:"absolute",left:0,top:0,bottom:0,width:`${(prev/max)*100}%`,background:c,opacity:.28}}></div>}
              <div style={{position:"absolute",left:0,top:0,bottom:0,width:`${(v/max)*100}%`,borderRadius:99,background:`linear-gradient(90deg, color-mix(in srgb, ${c} 55%, transparent), ${c})`}}></div>
            </div>
          </div>
        );
      })}
      <div style={{display:"flex",alignItems:"center",gap:7,marginTop:2}}>
        <span style={{width:16,height:7,borderRadius:99,background:"var(--ios-label3)",opacity:.5,display:"block"}}></span>
        <span style={{fontSize:10.5,color:"var(--ios-label3)"}}>sombra = período anterior</span>
      </div>
    </div>
  );
}

/** Rosca com gradiente por fatia e leitura do maior segmento no centro. */
function Donut({ data, size=124, stroke=17, unit="séries" }){
  const r=(size-stroke)/2, c=2*Math.PI*r, total=data.reduce((a,d)=>a+d[1],0);
  let acc=0;
  const top=[...data].sort((a,b)=>b[1]-a[1])[0];
  return (
    <div style={{display:"flex",alignItems:"center",gap:16}}>
      <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
        <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--track)" strokeWidth={stroke} />
          {data.map(([l,v,col])=>{
            const len=(v/total)*c, off=-acc; acc+=len;
            return <circle key={l} cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={stroke} strokeDasharray={`${Math.max(0,len-4)} ${c}`} strokeDashoffset={off} strokeLinecap="round" style={{filter:`drop-shadow(0 0 6px color-mix(in srgb, ${col} 45%, transparent))`}} />;
          })}
        </svg>
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <span style={{fontFamily:"var(--font-display)",fontSize:22,fontWeight:800,color:"var(--ios-label)",letterSpacing:"-.03em"}}>{total}</span>
          <span style={{fontSize:8.5,fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",color:"var(--ios-label3)"}}>{unit}</span>
        </div>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",gap:9,minWidth:0}}>
        {data.map(([l,v,col,tcol])=>{
          const pct=Math.round((v/total)*100);
          return (
            <div key={l}>
              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:4}}>
                <span style={{width:8,height:8,borderRadius:2.5,background:col,display:"block",flexShrink:0}}></span>
                <span style={{fontSize:11.5,color:"var(--ios-label2)",flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l}</span>
                <span style={{fontSize:11.5,fontWeight:800,color:tcol}}>{pct}%</span>
              </div>
              <div style={{height:4,borderRadius:99,background:"var(--track)",overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:col,borderRadius:99}}></div></div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/** Radar com preenchimento em gradiente e a referência anterior tracejada. */
function Radar({ axes, now, before, size=214 }){
  const cx=size/2, cy=size/2, r=size/2-34, n=axes.length, gid=uid("r");
  const pt=(i,f)=>[cx+r*f*Math.cos(-Math.PI/2+i*2*Math.PI/n), cy+r*f*Math.sin(-Math.PI/2+i*2*Math.PI/n)];
  const poly=vals=>vals.map((v,i)=>pt(i,v).join(",")).join(" ");
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{width:"100%",height:size,display:"block",overflow:"visible"}}>
      <defs>
        <radialGradient id={gid}>
          <stop offset="0%" stopColor={LIME} stopOpacity="0.42" />
          <stop offset="100%" stopColor={LIME} stopOpacity="0.12" />
        </radialGradient>
      </defs>
      {[0.25,0.5,0.75,1].map(f=><polygon key={f} points={poly(axes.map(()=>f))} fill="none" stroke="var(--grid)" strokeWidth="1" />)}
      {axes.map((a,i)=>{const[x,y]=pt(i,1);return <line key={a} x1={cx} y1={cy} x2={x} y2={y} stroke="var(--grid)" strokeWidth="1" />;})}
      <polygon points={poly(before)} fill="none" stroke="var(--ios-label3)" strokeWidth="1.6" strokeDasharray="4 4" />
      <polygon points={poly(now)} fill={`url(#${gid})`} stroke={LIME} strokeWidth="2.4" strokeLinejoin="round" style={{filter:`drop-shadow(0 0 9px color-mix(in srgb, ${LIME} 60%, transparent))`}} />
      {now.map((v,i)=>{const[x,y]=pt(i,v);return <circle key={i} cx={x} cy={y} r="3.6" fill={LIME} stroke="var(--ios-bg)" strokeWidth="1.5" />;})}
      {axes.map((a,i)=>{const[x,y]=pt(i,1.26);return <text key={a} x={x} y={y} fill="var(--ios-label2)" fontSize="9.5" fontWeight="700" textAnchor="middle" dominantBaseline="middle">{a}</text>;})}
    </svg>
  );
}

/** Heatmap de consistência com meses e dias da semana. */
function Heatmap({ weeks=13 }){
  const cells=Array.from({length:weeks*7},(_,i)=>(i>weeks*7-4?0:Math.round((Math.sin(i*1.7)*0.5+0.5)*3+(i%5===0?0:1))%4));
  const shades=["var(--track)",`color-mix(in srgb, ${LIME} 26%, transparent)`,`color-mix(in srgb, ${LIME} 55%, transparent)`,LIME];
  const months=["Jun","Jul","Ago"];
  return (
    <div>
      <div style={{display:"flex",gap:6}}>
        <div style={{display:"flex",flexDirection:"column",justifyContent:"space-between",paddingTop:2,paddingBottom:2,width:16,flexShrink:0}}>
          {["S","","Q","","S","","D"].map((d,i)=><span key={i} style={{fontSize:8.5,fontWeight:700,color:"var(--ios-label3)",height:9,lineHeight:"9px"}}>{d}</span>)}
        </div>
        <div style={{flex:1,display:"grid",gridTemplateColumns:`repeat(${weeks},1fr)`,gap:3.5}}>
          {Array.from({length:weeks*7}).map((_,i)=>{
            const col=i%weeks, rowi=Math.floor(i/weeks), v=cells[col*7+rowi];
            return <div key={i} style={{aspectRatio:"1",borderRadius:3,background:shades[v],boxShadow:v===3?`0 0 8px -2px ${LIME}`:"none"}}></div>;
          })}
        </div>
      </div>
      <div style={{display:"flex",marginLeft:22,marginTop:7}}>
        {months.map(m=><span key={m} style={{flex:1,fontSize:9.5,fontWeight:700,color:"var(--ios-label3)"}}>{m}</span>)}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:6,marginTop:8,justifyContent:"flex-end"}}>

/** Sparkline para dentro dos cartões de número. */
function Spark({ data, color, height=26 }){
  const w=88, min=Math.min(...data), max=Math.max(...data), span=(max-min)||1, gid=uid("s");
  const pts=data.map((v,i)=>[ (i*w)/(data.length-1), height-2-((v-min)/span)*(height-6) ]);
  return (
    <svg viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{width:"100%",height,display:"block",marginTop:8}}>
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity=".38" /><stop offset="100%" stopColor={color} stopOpacity="0" /></linearGradient></defs>
      <path d={`${smoothPath(pts)} L${w},${height} L0,${height} Z`} fill={`url(#${gid})`} />
      <path d={smoothPath(pts)} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2.4" fill={color} />
    </svg>
  );
}

/** Barra de progresso de meta com marcador de ritmo esperado. */
function GoalBar({ value, target, color, tcolor, pace=null, format=v=>v }){
  const pct=Math.min(100,(value/target)*100);
  return (
    <div style={{position:"relative",height:10,borderRadius:99,background:"var(--track)"}}>
      <div style={{position:"absolute",left:0,top:0,bottom:0,width:`${pct}%`,borderRadius:99,background:`linear-gradient(90deg, color-mix(in srgb, ${color} 50%, transparent), ${color})`,boxShadow:`0 0 12px -3px ${color}`}}></div>
      {pace!=null && <div style={{position:"absolute",left:`${Math.min(100,(pace/target)*100)}%`,top:-3,bottom:-3,width:2,borderRadius:2,background:"var(--ios-label2)",opacity:.7}}></div>}
    </div>
  );
}

function Delta({ value, unit, good }){
  const up=value>0;
  const tone=good===null?"var(--ios-label2)":(good?GT:RT);
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:11.5,fontWeight:800,color:tone,background:good===null?"var(--glass-strong)":`color-mix(in srgb, ${good?G:R} 16%, transparent)`,padding:"2px 7px",borderRadius:99}}>
      {I(up?"trending-up":"trending-down",12,tone)}{Math.abs(value).toString().replace(".",",")}{unit?" "+unit:""}
    </span>
  );
}
function Stat({ icon, label, value, unit, delta, color, tcolor, spark }){
  return (
    <div className="glass" style={{flex:1,padding:14,minWidth:0,overflow:"hidden"}}>
      <div style={{width:28,height:28,borderRadius:9,background:`color-mix(in srgb, ${color} 18%, transparent)`,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:10}}>{I(icon,14,tcolor)}</div>
      <div style={{display:"flex",alignItems:"baseline",gap:3}}>
        <span style={{fontFamily:"var(--font-display)",fontSize:21,fontWeight:800,color:"var(--ios-label)",letterSpacing:"-.03em"}}>{value}</span>
        {unit && <span style={{fontSize:10.5,fontWeight:700,color:"var(--ios-label2)"}}>{unit}</span>}
      </div>
      <div style={{fontSize:11,color:"var(--ios-label2)",marginTop:2}}>{label}</div>
      {spark && <Spark data={spark} color={color} />}
      {delta && <div style={{marginTop:7}}>{delta}</div>}
    </div>
  );
}

function TabBar({active="progress"}){return <KitTabBar active={active}/>;}

function Phone(p){return <ThemePair><PhoneOne {...p}/></ThemePair>;}
function PhoneOne({ step, label, footer, children }){
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
        <span style={{width:20,height:20,borderRadius:99,background:LIME,color:"#0d1a00",fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}}>{step}</span>
        <span style={{color:"hsl(var(--muted-foreground))",fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:".1em"}}>{label}</span>
      </div>
      <div className="phone">
        <div className="glow"></div>
        <div className="island"></div>
        <StatusBar/>
        {children}
        {footer && (
          <div className="footerbar">
            <div className="btn ghost" style={{flex:"0 0 auto",padding:"0 16px"}}>{I(footer[1],15,"var(--ios-label)")} {footer[0]}</div>
            <div className="btn primary" style={{flex:1}}>{I(footer[3],15,"#0d1a00")} {footer[2]}</div>
          </div>
        )}
        <TabBar/>
        <div className="homebar"></div>
      </div>
    </div>
  );
}
