--slot:rgba(60,60,67,.05);--slot-line:rgba(60,60,67,.09);
--track:rgba(60,60,67,.14);--sheet-scrim:rgba(60,60,67,.45);

}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--ios-bg);border-top:1px solid var(--glass-brd);border-radius:32px 32px 0 0;padding:22px 26px 26px;box-shadow:0 -20px 50px -10px rgba(0,0,0,.6)}
.scrim{position:absolute;inset:0;z-index:7;background:var(--sheet-scrim);backdrop-filter:blur(2px)}

<div id="root"></div>
<script type="text/babel" data-presets="react" src="../kit/hero-objects.js"></script>
<script type="text/babel" src="../kit/kit.jsx"></script>
<script type="text/babel" data-presets="react">
const I=(n,s=20,c)=><i data-lucide={n} style={{width:s,height:s,display:"block",color:c,flexShrink:0}}></i>;
const LIME="hsl(var(--primary))", LIMET="hsl(var(--primary-text))";
const SLEEP="var(--sleep)", SLEEPT="var(--sleep-t)", HR="var(--hr)", HRT="var(--hr-t)";
const STEPS="var(--steps)", STEPST="var(--steps-t)", KCAL="var(--kcal)", KCALT="var(--kcal-t)";
const DANGER="var(--danger)", DANGERT="var(--danger-t)";

function StatusBar(){
  return <div className="statusbar"><span>9:41</span><span style={{display:"flex",alignItems:"center",gap:6}}>{I("signal",16,"var(--on-hero)")}{I("wifi",16,"var(--on-hero)")}{I("battery-full",20,"var(--on-hero)")}</span></div>;
}
function RoundBtn({ icon, size=38 }){
  return <div className="glass" style={{width:size,height:size,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,background:"var(--hero-chip)",borderColor:"var(--hero-chip-brd)"}}>{I(icon,size*0.47,"var(--on-hero)")}</div>;
}
function SectionTitle({ children, action }){
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",margin:"20px 2px 10px"}}>
      <span style={{fontSize:10.5,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",color:"var(--ios-label3)"}}>{children}</span>
      {action && <span style={{fontSize:11.5,fontWeight:600,color:LIMET}}>{action}</span>}
    </div>
  );
}
function Chip({ children, tone }){
  const map={primary:[LIME,"#0d1a00"],live:["color-mix(in srgb, #34D399 18%, transparent)",STEPST],warn:["color-mix(in srgb, #FBBF24 20%, transparent)",KCALT]};
  const [bg,fg]=map[tone]||["var(--glass-strong)","var(--ios-label2)"];
  return <span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 10px",borderRadius:99,fontSize:10.5,fontWeight:800,textTransform:"uppercase",letterSpacing:".06em",background:bg,color:fg}}>{children}</span>;
}
function Bullet({ children }){
  return (
    <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:9}}>
      <span style={{width:5,height:5,borderRadius:99,background:LIME,display:"block",flexShrink:0,marginTop:7}}></span>
      <span style={{fontSize:13,color:"var(--ios-label2)",lineHeight:1.5,flex:1}}>{children}</span>
    </div>
  );
}
function Metric({ icon, label, value, unit, delta, tone, ttone }){
  return (
    <div className="glass" style={{flex:1,padding:14}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <div style={{width:28,height:28,borderRadius:9,background:`color-mix(in srgb, ${tone} 18%, transparent)`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{I(icon,14,ttone)}</div>
        <span style={{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--ios-label3)"}}>{label}</span>
      </div>
      <div style={{display:"flex",alignItems:"baseline",gap:4,marginTop:10}}>
        <span style={{fontFamily:"var(--font-display)",fontSize:25,fontWeight:800,color:"var(--ios-label)",letterSpacing:"-.03em"}}>{value}</span>
        {unit && <span style={{fontSize:11.5,fontWeight:700,color:"var(--ios-label2)"}}>{unit}</span>}
      </div>
      {delta && <div style={{fontSize:11,color:delta[1]?ttone:"var(--ios-label3)",marginTop:3,fontWeight:delta[1]?700:500}}>{delta[0]}</div>}
    </div>
  );
}
function Bars({ data, color, tcolor, format }){
  const max=Math.max(...data.map(d=>d[1]));
  return (
    <div style={{display:"flex",alignItems:"flex-end",gap:7,height:112}}>
      {data.map(([d,v],i)=>(
        <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,height:"100%",justifyContent:"flex-end"}}>
          <span style={{fontSize:9.5,fontWeight:700,color:i===data.length-1?tcolor:"var(--ios-label3)"}}>{format(v)}</span>
          <div style={{width:"100%",height:`${Math.max(6,(v/max)*100)}%`,borderRadius:7,background:i===data.length-1?color:`color-mix(in srgb, ${color} 40%, transparent)`}}></div>
          <span style={{fontSize:10,fontWeight:700,color:"var(--ios-label3)"}}>{d}</span>
        </div>
      ))}
    </div>
  );
}

/* ---------- 1. Consentimento de dados de saúde ---------- */

        <div className="glass" style={{height:90,marginTop:12}}></div>
      </div>
      <div className="scrim"></div>
      <div className="sheet" style={{maxHeight:"88%",overflow:"hidden"}}>
        <Pedestal size={104} lift={4}><LockObject scale={0.56} /></Pedestal>
        <div style={{fontFamily:"var(--font-display)",fontSize:23,fontWeight:800,color:"var(--ios-label)",textAlign:"center",letterSpacing:"-.03em",marginTop:8}}>Seus dados de saúde</div>
        <div style={{fontSize:13,color:"var(--ios-label2)",textAlign:"center",lineHeight:1.5,marginTop:7}}>Atualizamos o texto que explica o que guardamos e quem lê. Precisamos do seu aceite outra vez.</div>
        <div style={{fontSize:13.5,fontWeight:700,color:"var(--ios-label)",marginTop:20,marginBottom:9}}>O que é armazenado</div>
        <Bullet>Avaliação física, anamnese e body scan</Bullet>
        <Bullet>Passos, calorias, sono e frequência cardíaca de repouso</Bullet>
        <Bullet>Frequência cardíaca média das suas corridas</Bullet>
        <div style={{fontSize:13.5,fontWeight:700,color:"var(--ios-label)",marginTop:14,marginBottom:6}}>{aluno?"Quem lê":"Privacidade"}</div>
        <div style={{fontSize:13,color:"var(--ios-label2)",lineHeight:1.5}}>{aluno?"Seu especialista vê estes dados, inclusive o que você escrever no feedback de fim de treino.":"Só você vê estes dados."}</div>
        <div style={{fontSize:11.5,color:"var(--ios-label2)",lineHeight:1.5,marginTop:14}}>Base legal: Tutela da saúde (Art. 11, II, f) e Consentimento (Art. 11, I) da LGPD. Você pode revogar quando quiser no seu perfil — a revogação vale daqui para frente. Versão 1.3 da política.</div>
        <div className="btn primary" style={{marginTop:14}}>Aceitar e continuar</div>
        <div className="btn ghost" style={{marginTop:9}}>Agora não</div>
        <div style={{fontSize:11.5,color:"var(--ios-label2)",textAlign:"center",lineHeight:1.5,marginTop:12}}>Sem o aceite o app continua funcionando, mas para de registrar treinos, refeições e medidas.</div>
      </div>
    </>
  );
}

/* ---------- 2. Conectar relógio ---------- */
function ConnectScreen(){
  return (
    <div className="scroll">
      <div style={{paddingTop:6,display:"flex",alignItems:"center",gap:12}}>
        <RoundBtn icon="chevron-left" />
        <div style={{flex:1,textAlign:"center",fontSize:14.5,fontWeight:700,color:"var(--on-hero)"}}>Você está quase lá</div>
        <div style={{width:38}}></div>
      </div>
      <div style={{height:4,borderRadius:99,background:"var(--track)",marginTop:14,overflow:"hidden"}}><div style={{width:"90%",height:"100%",background:LIME,borderRadius:99}}></div></div>
      <Pedestal size={246} lift={10}><WatchObject scale={0.94} /></Pedestal>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:11,marginTop:2}}>
        <div className="glass" style={{width:44,height:44,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",borderColor:LIME}}>{I("dumbbell",20,LIMET)}</div>
        {I("arrow-left-right",17,"var(--ios-label3)")}
        <div className="glass" style={{width:44,height:44,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center"}}>{I("heart-pulse",20,HRT)}</div>
      </div>
      <div style={{fontFamily:"var(--font-display)",fontSize:25,fontWeight:800,color:"var(--on-hero)",textAlign:"center",letterSpacing:"-.03em",marginTop:22}}>Sincronizar com<br/>Apple Health</div>
      <div className="glass" style={{padding:15,marginTop:18}}>
        <Bullet><b style={{color:"var(--ios-label)"}}>Lemos do seu relógio</b> passos, calorias, sono, frequência cardíaca de repouso e a FC média das corridas — para acompanhar sua atividade entre os treinos.</Bullet>
        <Bullet>Durante a corrida o GPS mede <b style={{color:"var(--ios-label)"}}>distância e ritmo</b>. O caminho é desenhado na tela e <b style={{color:"var(--ios-label)"}}>descartado ao fim do treino</b> — não é salvo nem enviado.</Bullet>
        <div style={{display:"flex",gap:10,alignItems:"flex-start",marginTop:12,paddingTop:12,borderTop:"1px solid var(--glass-brd)"}}>
          {I("lock",14,"var(--ios-label3)")}

        </div>
      </div>
      <div style={{height:150}}></div>
    </div>
  );
}

/* ---------- 3. Permissões por tipo ---------- */
function PermissionsScreen(){
  const PERMS=[
    ["footprints","Passos","Total do dia",STEPS,STEPST,true],
    ["flame","Calorias ativas","Gasto estimado do dia",KCAL,KCALT,true],
    ["moon","Sono","Minutos dormidos na noite",SLEEP,SLEEPT,true],
    ["heart-pulse","FC de repouso","Uma leitura por dia",HR,HRT,true],
    ["activity","FC durante o treino","Média da janela da sessão",HR,HRT,false],
  ];
  return (
    <div className="scroll">
      <div style={{paddingTop:6,display:"flex",alignItems:"center",gap:12}}>
        <RoundBtn icon="chevron-left" />
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12,fontWeight:700,color:"var(--on-hero-2)",textTransform:"uppercase",letterSpacing:".04em"}}>Apple Health</div>
          <div style={{fontSize:21,fontWeight:700,color:"var(--on-hero)",letterSpacing:"-.03em",marginTop:2}}>O que você autoriza</div>
        </div>
      </div>
      <div className="glass" style={{padding:14,marginTop:16,display:"flex",gap:12,alignItems:"flex-start"}}>
        <div style={{width:32,height:32,borderRadius:11,background:"var(--glass-strong)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{I("toggle-right",15,LIMET)}</div>
        <div style={{fontSize:12.5,color:"var(--ios-label2)",lineHeight:1.45}}>Cada tipo é liberado separadamente. Recusar o sono não impede a leitura dos passos.</div>
      </div>
      <SectionTitle action="4 de 5 ativos">Tipos de dado</SectionTitle>
      {PERMS.map(([icon,name,desc,tone,ttone,on])=>(
        <div key={name} className="glass" style={{padding:13,display:"flex",alignItems:"center",gap:12,marginBottom:9}}>
          <div style={{width:34,height:34,borderRadius:11,background:`color-mix(in srgb, ${tone} 18%, transparent)`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{I(icon,16,ttone)}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14,fontWeight:600,color:"var(--ios-label)"}}>{name}</div>
            <div style={{fontSize:11.5,color:"var(--ios-label2)",marginTop:1}}>{desc}</div>
          </div>
          <div style={{width:46,height:28,borderRadius:99,flexShrink:0,background:on?LIME:"var(--glass-strong)",display:"flex",alignItems:"center",padding:3,justifyContent:on?"flex-end":"flex-start"}}>
            <div style={{width:22,height:22,borderRadius:99,background:on?"#0d1a00":"var(--ios-label3)"}}></div>

        <div style={{width:34,height:34,borderRadius:11,background:"var(--glass-strong)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{I("refresh-cw",16,LIMET)}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:600,color:"var(--ios-label)"}}>Sincronizar sozinho</div>
          <div style={{fontSize:11.5,color:"var(--ios-label2)",marginTop:1}}>Sem ela, os dados só chegam quando você abre o app</div>
        </div>
        <div style={{width:46,height:28,borderRadius:99,flexShrink:0,background:LIME,display:"flex",alignItems:"center",padding:3,justifyContent:"flex-end"}}>
          <div style={{width:22,height:22,borderRadius:99,background:"#0d1a00"}}></div>
        </div>
      </div>
      <div style={{height:150}}></div>
    </div>
  );
}

          <div style={{display:"flex",alignItems:"baseline",gap:6,marginTop:5}}>
