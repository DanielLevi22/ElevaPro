<script type="text/babel" data-presets="react">
const I=(n,s=20,c)=><i data-lucide={n} style={{width:s,height:s,display:"block",color:c,flexShrink:0}}></i>;
const LIME="hsl(var(--primary))";
const BLUE="#00F0FF", PINK="#FF0099", GREEN="#34D399", AMBER="#FBBF24", RED="#FB7185";
const IMG={back:"../../foundations/assets/imagery/workout-back.jpg",arms:"../../foundations/assets/imagery/workout-arms.jpg",chest:"../../foundations/assets/imagery/workout-chest.jpg",legs:"../../foundations/assets/imagery/workout-legs.jpg"};

function StatusBar(){
  return <div className="statusbar"><span>9:41</span><span style={{display:"flex",alignItems:"center",gap:6}}>{I("signal",16,"var(--on-hero)")}{I("wifi",16,"var(--on-hero)")}{I("battery-full",20,"var(--on-hero)")}</span></div>;
}
function RoundBtn({ icon, size=38 }){
  return <div className="glass" style={{width:size,height:size,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,background:"var(--hero-chip)",borderColor:"var(--hero-chip-brd)"}}>{I(icon,size*0.47,"var(--on-hero)")}</div>;
}
function HeroHeader({ eyebrow, title, right, back=true }){
  return (
    <div style={{paddingTop:14,display:"flex",alignItems:"center",gap:12}}>
      {back && <RoundBtn icon="chevron-left" />}
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:12,fontWeight:700,color:"var(--on-hero-2)",letterSpacing:".04em",textTransform:"uppercase"}}>{eyebrow}</div>
        <div style={{fontSize:22,fontWeight:700,color:"var(--on-hero)",letterSpacing:"-.03em",marginTop:2}}>{title}</div>
      </div>
      {right}
    </div>
  );
}
function SectionTitle({ children, action }){
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",margin:"20px 2px 10px"}}>
      <span style={{fontSize:10.5,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",color:"var(--ios-label3)"}}>{children}</span>
      {action && <span style={{fontSize:11.5,color:"var(--ios-label3)"}}>{action}</span>}
    </div>
  );
}
function Chip({ children, tone, color }){
  const on = tone==="primary";
  return <span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 10px",borderRadius:99,fontSize:10.5,fontWeight:800,textTransform:"uppercase",letterSpacing:".06em",background:on?LIME:"var(--glass-strong)",color:on?"#0d1a00":(color||"var(--ios-label2)")}}>{children}</span>;
}
function Bar({ pct, color=LIME, h=6 }){
  return <div style={{height:h,borderRadius:99,background:"var(--glass-strong)",overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:99}} /></div>;
}
function Field({ label, value, placeholder, icon, suffix }){
  return (
    <div style={{marginBottom:12}}>
      <div style={{fontSize:10.5,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",color:"var(--ios-label3)",marginBottom:6,paddingLeft:2}}>{label}</div>
      <div style={{display:"flex",alignItems:"center",gap:10,height:48,padding:"0 14px",borderRadius:14,background:"var(--field)",border:"1px solid var(--field-brd)"}}>
        {icon && I(icon,17,"var(--ios-label3)")}
        <span style={{flex:1,fontSize:14.5,fontWeight:value?600:400,color:value?"var(--ios-label)":"var(--ios-label3)",letterSpacing:"-.01em",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{value||placeholder}</span>
        {suffix && <span style={{fontSize:12.5,color:"var(--ios-label3)",fontWeight:600}}>{suffix}</span>}
      </div>
    </div>
  );
}
function Steps({ n, total, label }){
  return (
    <div style={{display:"flex",alignItems:"center",gap:9,marginTop:16}}>
      <div style={{flex:1,display:"flex",gap:5}}>
        {Array.from({length:total}).map((_,i)=><div key={i} style={{flex:1,height:4,borderRadius:99,background:i<n?LIME:"var(--glass-strong)"}} />)}
      </div>
      <span style={{fontSize:11,fontWeight:700,color:"var(--ios-label3)",letterSpacing:".06em"}}>{label}</span>
    </div>
  );
}
function Avatar({ initials, size=40, tone=LIME, dot }){
  return (
    <div style={{position:"relative",flexShrink:0}}>
      <div style={{width:size,height:size,borderRadius:99,background:"var(--glass-strong)",border:`1px solid ${tone}55`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.33,fontWeight:800,color:tone,letterSpacing:"-.02em"}}>{initials}</div>
      {dot && <span style={{position:"absolute",right:-1,bottom:-1,width:11,height:11,borderRadius:99,background:dot,border:"2px solid var(--ios-bg)"}} />}
    </div>
  );
}
function Row({ children, style }){ return <div style={{display:"flex",alignItems:"center",gap:12,...style}}>{children}</div>; }

/* ---------- 1. Painel do especialista ---------- */
function PanelScreen(){

  ];
  return (
    <div className="scroll">
      <HeroHeader back={false} eyebrow="Sexta-feira, 12 de setembro" title="Olá, Daniel" right={<RoundBtn icon="bell" />} />
      <Row style={{gap:10,marginTop:18}}>
        {STATS.map(([l,v,c])=>(
          <div key={l} className="glass" style={{flex:1,padding:"13px 12px"}}>
            <div style={{fontFamily:"var(--font-display)",fontSize:26,fontWeight:800,color:c,letterSpacing:"-.04em"}}>{v}</div>
            <div style={{fontSize:9.5,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--ios-label3)",marginTop:2}}>{l}</div>

      <SectionTitle action="3 novos">Alertas da IA</SectionTitle>
      {ALERTS.map(a=>(
        <div key={a.who} className="glass" style={{padding:13,marginBottom:9}}>

            <div style={{width:34,height:34,borderRadius:11,background:`${a.tone}1f`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{I(a.icon,17,a.tone)}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13.5,fontWeight:700,color:"var(--ios-label)",letterSpacing:"-.02em"}}>{a.who}</div>
              <div style={{fontSize:12,color:"var(--ios-label2)",marginTop:2,lineHeight:1.35}}>{a.txt}</div>
            </div>
          </Row>
        </div>
      ))}
      <SectionTitle action="Ver agenda">Hoje</SectionTitle>
      {[["08:00","Marina Alves","Avaliação física",LIME],["14:30","Pedro Luz","Revisão de dieta",BLUE],["18:00","Ana Rocha","Treino presencial",PINK]].map(([h,n,t,c])=>(
        <div key={h} className="glass" style={{padding:13,marginBottom:9}}>
          <Row>
            <div style={{fontFamily:"var(--font-display)",fontSize:14,fontWeight:800,color:c,width:44,letterSpacing:"-.02em"}}>{h}</div>
            <div style={{width:1,height:26,background:"var(--glass-brd)"}} />
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13.5,fontWeight:700,color:"var(--ios-label)"}}>{n}</div>
              <div style={{fontSize:11.5,color:"var(--ios-label2)"}}>{t}</div>
            </div>
            {I("chevron-right",16,"var(--ios-label3)")}
          </Row>
        </div>
      ))}
    </div>
  );
}
